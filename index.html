<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>platsprites</title>
<style>
  :root {
    --bg: #f6f5f2;
    --surface: #ffffff;
    --border: #e2e0da;
    --text: #1f1d1a;
    --muted: #6b675f;
    --accent: #c2410c;
    --accent-text: #ffffff;
    --error: #b91c1c;
    --ok: #15803d;
    --check-a: #ecebe7;
    --check-b: #f7f6f3;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151413;
      --surface: #1f1e1c;
      --border: #34322e;
      --text: #ece9e3;
      --muted: #a29d93;
      --accent: #f97316;
      --accent-text: #1a0d03;
      --error: #f87171;
      --ok: #4ade80;
      --check-a: #2a2926;
      --check-b: #23221f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { margin: 0; font-size: 26px; letter-spacing: -0.02em; }
  .tagline { margin: 4px 0 28px; color: var(--muted); }
  button, .button {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 7px 14px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font: inherit; font-size: 14px;
    text-decoration: none; cursor: pointer;
  }
  button:hover, .button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  button:disabled { opacity: 0.45; cursor: default; }
  .dropzone {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 56px 24px; border: 2px dashed var(--border); border-radius: 16px;
    background: var(--surface); text-align: center; cursor: pointer;
  }
  .dropzone.over, .card.over { border-color: var(--accent); }
  .dropzone.busy { pointer-events: none; cursor: progress; }
  .dropzone .loading { display: none; flex-direction: column; align-items: center; gap: 10px; }
  .dropzone.busy .prompt { display: none; }
  .dropzone.busy .loading { display: flex; }
  .dropzone .prompt { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .spinner {
    width: 32px; height: 32px; border-radius: 50%;
    border: 3px solid var(--border); border-top-color: var(--accent);
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 2.4s; } }
  .dropzone strong { font-size: 18px; color: var(--text); }
  .dropzone span { color: var(--muted); }
  .toolbar {
    position: sticky; top: 0; z-index: 1;
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
    margin: 0 -16px 20px; padding: 12px 16px;
    background: var(--bg); border-bottom: 1px solid var(--border);
  }
  .toolbar .rom { flex: 1 1 220px; min-width: 0; }
  .toolbar .rom strong { display: block; }
  .toolbar .rom span { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 20px; }
  .filters button { border-radius: 999px; padding: 5px 12px; }
  .filters button[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--bg); }
  .category { margin-bottom: 28px; }
  .starters {
    margin-bottom: 24px; padding: 14px; border: 1px solid var(--border); border-radius: 12px;
    background: var(--surface);
  }
  .starters.changed { border-color: var(--accent); }
  .starters h2 { margin: 0 0 4px; font-size: 17px; }
  .starter-inputs { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; margin: 12px 0; }
  .starter-inputs label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
  .starter-inputs input {
    padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font: inherit;
  }
  .starters .error { margin: 0; font-size: 13px; color: var(--error); }
  .category h2 { margin: 0 0 12px; font-size: 17px; }
  .category h2 span { color: var(--muted); font-weight: 400; font-size: 14px; }
  .status { min-height: 22px; margin: -8px 0 16px; color: var(--muted); }
  .status.error { color: var(--error); }
  .status.ok { color: var(--ok); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
  .card {
    display: flex; flex-direction: column; gap: 10px; padding: 14px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
  }
  .card.changed { border-color: var(--accent); }
  .card h3 { margin: 0; font-size: 15px; }
  .card code { color: var(--muted); font-size: 12px; }
  .previews { display: flex; gap: 10px; }
  figure { flex: 1; margin: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  figcaption { font-size: 12px; color: var(--muted); }
  canvas, .empty {
    border-radius: 8px;
    image-rendering: pixelated;
    background: repeating-conic-gradient(var(--check-a) 0 25%, var(--check-b) 0 50%) 0 0 / 16px 16px;
  }
  .empty {
    min-width: 72px;
    display: flex; align-items: center; justify-content: center; padding: 8px;
    font-size: 12px; color: var(--muted); text-align: center; border: 1px dashed var(--border);
    background: none;
  }
  .meta { margin: 0; font-size: 13px; color: var(--muted); }
  .card .error { margin: 0; font-size: 13px; color: var(--error); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <h1>platsprites</h1>
  <p class="tagline">Cambia los sprites del protagonista y de los rivales de Pokémon Platino, HeartGold, SoulSilver, Negro, Blanco y Esmeralda.</p>

  <label id="loader" class="dropzone">
    <span class="prompt">
      <strong>Arrastra aquí tu ROM .nds o .gba</strong>
      <span>o haz clic para elegirla. Tu archivo original no se modifica.</span>
    </span>
    <span class="loading" role="status" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <strong class="loading-title"></strong>
      <span class="loading-detail"></span>
    </span>
    <input id="rom-input" type="file" accept=".nds,.gba" hidden>
  </label>

  <section id="editor" hidden>
    <div class="toolbar">
      <div class="rom"><strong id="game-name"></strong><span id="rom-name"></span></div>
      <button type="button" id="change-rom">Otra ROM</button>
      <button type="button" id="build" class="primary" disabled>Generar ROM</button>
    </div>
    <p id="status" class="status"></p>
    <section id="starters" class="starters" hidden>
      <h2>Iniciales</h2>
      <p class="meta">Elige los 3 Pokémon iniciales. El rival usará el que le corresponda según el que escojas, ya evolucionado donde antes lo estaba.</p>
      <div class="starter-inputs">
        <label>Inicial 1<input list="species-list" autocomplete="off"></label>
        <label>Inicial 2<input list="species-list" autocomplete="off"></label>
        <label>Inicial 3<input list="species-list" autocomplete="off"></label>
      </div>
      <datalist id="species-list"></datalist>
      <p class="error" hidden></p>
      <button type="button" id="reset-starters" hidden>Dejar los originales</button>
    </section>
    <div id="filters" class="filters" role="group" aria-label="Filtrar por categoría"></div>
    <div id="categories"></div>
  </section>
  <p id="loader-status" class="status"></p>
</main>

<template id="card-template">
  <article class="card">
    <div><h3></h3><code></code></div>
    <div class="previews">
      <figure><canvas class="original"></canvas><figcaption>Original</figcaption></figure>
      <figure>
        <canvas class="custom" hidden></canvas>
        <div class="empty">Suelta tu PNG aquí</div>
        <figcaption>Tuyo</figcaption>
      </figure>
    </div>
    <p class="meta"></p>
    <p class="error" hidden></p>
    <div class="actions">
      <a class="button download">Descargar PNG</a>
      <label class="button">Subir PNG<input type="file" accept="image/png" hidden></label>
      <button type="button" class="revert" hidden>Quitar</button>
    </div>
  </article>
</template>

<script src="https://cdn.jsdelivr.net/pyodide/v314.0.7/full/pyodide.js"></script>
<script>
// Runs platsprites' Python inside this tab with Pyodide, so the page needs no server:
// the ROM and the PNGs never leave the browser.
window.platspritesInBrowser = (async () => {
  const sources = {"graphics.py": "\"\"\"The kinds of graphics a slot can point at, each converted to and from a SpriteSheet.\n\nEvery kind reads its files from NARC archives through `files(path)`, which\nreturns that archive's mutable list of member files, and writes back by\nreplacing members in that list.\n\"\"\"\n\nimport struct\nfrom collections.abc import Callable\nfrom dataclasses import dataclass\n\nfrom platsprites.nitro2d import (\n    TILE_SIZE,\n    Cell,\n    Nitro2dError,\n    Oam,\n    Screen,\n    ScreenEntry,\n    decrypt_scanned,\n    encrypt_scanned,\n    read_cells,\n    read_characters,\n    read_palette,\n    read_screen,\n    write_character_pixels,\n    write_palette_colors,\n    write_screen_entries,\n)\nfrom platsprites.nsbtx import read_sprite_sheet, write_sprite_sheet\nfrom platsprites.sheet import (\n    TRANSPARENT_INDEX,\n    PlatspritesError,\n    SpriteSheet,\n    pack_4bpp,\n    unpack_4bpp,\n)\n\nArchiveFiles = Callable[[str], list[bytes]]\nCOLORS_PER_ROW = 16\nBYTES_PER_4BPP_TILE = 32\n# One byte per pixel: unpacked 4bpp tiles and 8bpp tiles alike.\nPIXELS_PER_TILE = TILE_SIZE * TILE_SIZE\n\n\nclass GraphicError(PlatspritesError):\n    pass\n\n\n@dataclass(frozen=True)\nclass OverworldSprite:\n    \"\"\"A map sprite: one NSBTX with a 4bpp texture per animation frame.\"\"\"\n\n    narc: str\n    index: int\n    texture_name: str\n\n    def read(self, files: ArchiveFiles) -> SpriteSheet:\n        sheet = read_sprite_sheet(files(self.narc)[self.index])\n        # Long names get truncated to fit the 16-byte name plus the frame suffix.\n        if not sheet.name or not self.texture_name.startswith(sheet.name):\n            raise GraphicError(\n                f\"el sprite {self.index} se llama '{sheet.name}' y se esperaba '{self.texture_name}';\"\n                \" la ROM parece modificada de una forma que esta herramienta no reconoce\"\n            )\n        return sheet\n\n    def write(self, files: ArchiveFiles, sheet: SpriteSheet) -> None:\n        archive = files(self.narc)\n        archive[self.index] = write_sprite_sheet(archive[self.index], sheet)\n\n\n@dataclass(frozen=True)\nclass Box:\n    x: int\n    y: int\n    width: int\n    height: int\n\n    @staticmethod\n    def around(boxes: list[\"Box\"]) -> \"Box\":\n        left = min(box.x for box in boxes)\n        top = min(box.y for box in boxes)\n        right = max(box.x + box.width for box in boxes)\n        bottom = max(box.y + box.height for box in boxes)\n        return Box(left, top, right - left, bottom - top)\n\n\n@dataclass\nclass _CellImage:\n    \"\"\"An OBJ sprite built from cells: each cell is one frame made of OAM pieces.\"\"\"\n\n    characters: bytes\n    palette: list[int]\n    cells: list[Cell]\n    # The game's number for each kept cell; cells without pieces draw nothing and are left out.\n    cell_numbers: list[int]\n\n    @classmethod\n    def load(cls, ncgr: bytes, nclr: bytes, ncer: bytes) -> \"_CellImage\":\n        characters = read_characters(ncgr)\n        if characters.bits_per_pixel != 4:\n            raise GraphicError(\"solo se soportan sprites de 16 colores\")\n        numbered = [\n            (number, cell) for number, cell in enumerate(read_cells(ncer)) if cell.oams\n        ]\n        return cls(\n            characters=characters.pixels,\n            palette=read_palette(nclr).colors[:COLORS_PER_ROW],\n            cells=[cell for _, cell in numbered],\n            cell_numbers=[number for number, _ in numbered],\n        )\n\n    def boxes(self) -> list[Box]:\n        return [_oam_box(oam) for cell in self.cells for oam in cell.oams]\n\n    def render(self, canvas: Box) -> list[bytes]:\n        frames = []\n        for cell in self.cells:\n            pixels = bytearray(canvas.width * canvas.height)\n            for oam in cell.oams:\n                for x, y, tile, tile_x, tile_y in _oam_pixels(oam):\n                    index = (y - canvas.y) * canvas.width + (x - canvas.x)\n                    pixels[index] = _tile_pixel(self.characters, tile, tile_x, tile_y)\n            frames.append(bytes(pixels))\n        return frames\n\n    def store(self, canvas: Box, frames: list[bytes]) -> bytes:\n        \"\"\"Return the NCGR pixel data with every cell's OAMs filled from `frames`.\"\"\"\n        unpacked = bytearray(unpack_4bpp(self.characters))\n        for number, (cell, frame) in enumerate(zip(self.cells, frames), start=1):\n            _check_drawn_inside(\n                frame, canvas, [_oam_box(oam) for oam in cell.oams], number\n            )\n            for oam in cell.oams:\n                for x, y, tile, tile_x, tile_y in _oam_pixels(oam):\n                    value = frame[(y - canvas.y) * canvas.width + (x - canvas.x)]\n                    unpacked[tile * PIXELS_PER_TILE + tile_y * TILE_SIZE + tile_x] = (\n                        value\n                    )\n        return pack_4bpp(bytes(unpacked))\n\n\n@dataclass(frozen=True)\nclass Mugshot:\n    \"\"\"The player's portrait on the VS screen before league and gym battles.\"\"\"\n\n    narc: str\n    nclr: int\n    ncgr: int\n    ncer: int\n\n    def read(self, files: ArchiveFiles) -> SpriteSheet:\n        image, canvas = self._load(files)\n        return _sheet(self.ncgr, canvas, image.render(canvas), image.palette)\n\n    def write(self, files: ArchiveFiles, sheet: SpriteSheet) -> None:\n        image, canvas = self._load(files)\n        archive = files(self.narc)\n        archive[self.ncgr] = write_character_pixels(\n            archive[self.ncgr], image.store(canvas, sheet.frames)\n        )\n        archive[self.nclr] = write_palette_colors(archive[self.nclr], 0, sheet.palette)\n\n    def _load(self, files: ArchiveFiles) -> tuple[_CellImage, Box]:\n        archive = files(self.narc)\n        _check_magic(\n            archive, {self.nclr: b\"RLCN\", self.ncgr: b\"RGCN\", self.ncer: b\"RECN\"}\n        )\n        image = _CellImage.load(\n            archive[self.ncgr], archive[self.nclr], archive[self.ncer]\n        )\n        return image, Box.around(image.boxes())\n\n\nTRAINER_FRONT_NARC = \"poketool/trgra/trfgra.narc\"\nTRAINER_BACK_NARC = \"poketool/trgra/trbgra.narc\"\nFILES_PER_TRAINER_CLASS = 5\nSTATIC_FRAME_BOX = Box(-40, -40, 80, 80)\nSTATIC_FRAMES = 2\n\n\n@dataclass(frozen=True)\nclass TrainerBattleSprite:\n    \"\"\"A trainer's sprite in battle: a rival's front or the player's back.\n\n    Each one is five files from `first_file` on in its archive. The game keeps two\n    copies: an animated one (cells, played when the battle starts, and for the\n    player also when throwing a Poké Ball) and an encrypted 2-frame bitmap for the\n    rest of the battle. The sheet\n    lists the animation frames; `static_frames` says which animation frame each\n    bitmap frame equals in the retail game, or None when the bitmap frame exists\n    only there, in which case it is appended to the sheet as an extra frame.\n    \"\"\"\n\n    narc: str\n    first_file: int\n    static_frames: tuple[int | None, int | None]\n\n    def read(self, files: ArchiveFiles) -> SpriteSheet:\n        image, canvas = self._load(files)\n        frames = image.render(canvas)\n        static = self._static_frames(files)\n        for number, source in enumerate(self.static_frames):\n            if source is None:\n                frames.append(_place(static[number], STATIC_FRAME_BOX, canvas))\n        return _sheet(self._ncgr, canvas, frames, image.palette)\n\n    def write(self, files: ArchiveFiles, sheet: SpriteSheet) -> None:\n        image, canvas = self._load(files)\n        archive = files(self.narc)\n        animation_frames = sheet.frames[: len(image.cells)]\n        extra_numbers = iter(range(len(image.cells), len(sheet.frames)))\n        static = []\n        for source in self.static_frames:\n            if source is None:\n                number = next(extra_numbers)\n                _check_drawn_inside(\n                    sheet.frames[number], canvas, [STATIC_FRAME_BOX], number + 1\n                )\n            else:\n                number = image.cell_numbers.index(source)\n            static.append(_crop(sheet.frames[number], canvas, STATIC_FRAME_BOX))\n            if len(static) == 1:\n                _check_key_pixels(static[0], canvas, number + 1)\n\n        # Build every file before replacing any, so a refused sheet changes nothing.\n        animated = write_character_pixels(\n            archive[self._ncgr], image.store(canvas, animation_frames)\n        )\n        scanned = self._store_static(archive[self._scan], static)\n        archive[self._ncgr] = animated\n        archive[self._scan] = scanned\n        archive[self._nclr] = write_palette_colors(\n            archive[self._nclr], 0, sheet.palette\n        )\n\n    @property\n    def _ncgr(self) -> int:\n        return self.first_file\n\n    @property\n    def _nclr(self) -> int:\n        return self._ncgr + 1\n\n    @property\n    def _ncer(self) -> int:\n        return self._ncgr + 2\n\n    @property\n    def _scan(self) -> int:\n        return self._ncgr + 4\n\n    def _load(self, files: ArchiveFiles) -> tuple[_CellImage, Box]:\n        archive = files(self.narc)\n        _check_magic(\n            archive,\n            {\n                self._ncgr: b\"RGCN\",\n                self._nclr: b\"RLCN\",\n                self._ncer: b\"RECN\",\n                self._scan: b\"RGCN\",\n            },\n        )\n        image = _CellImage.load(\n            archive[self._ncgr], archive[self._nclr], archive[self._ncer]\n        )\n        return image, Box.around(image.boxes() + [STATIC_FRAME_BOX])\n\n    def _static_frames(self, files: ArchiveFiles) -> list[bytes]:\n        \"\"\"The two 80x80 frames of the encrypted bitmap, side by side in the file.\"\"\"\n        characters = read_characters(files(self.narc)[self._scan])\n        bitmap = unpack_4bpp(decrypt_scanned(characters.pixels))\n        width = characters.width_tiles * TILE_SIZE\n        size = STATIC_FRAME_BOX.width\n        return [\n            b\"\".join(\n                bitmap[row * width + number * size : row * width + (number + 1) * size]\n                for row in range(size)\n            )\n            for number in range(STATIC_FRAMES)\n        ]\n\n    def _store_static(self, scan: bytes, frames: list[bytes]) -> bytes:\n        characters = read_characters(scan)\n        size = STATIC_FRAME_BOX.width\n        bitmap = b\"\".join(\n            frame[row * size : (row + 1) * size]\n            for row in range(size)\n            for frame in frames\n        )\n        seed = struct.unpack_from(\"\u003cH\", characters.pixels)[0]\n        try:\n            pixels = encrypt_scanned(pack_4bpp(bitmap), seed)\n        except Nitro2dError as error:\n            raise GraphicError(f\"en el sprite fijo de batalla, {error}\") from error\n        return write_character_pixels(scan, pixels)\n\n\nTRAINER_CASE_NARC = \"graphic/trainer_case.narc\"\nCARD_PALETTE = 0\nCARD_CHARACTERS = 31\n# Map tiles (x, y, width, height) that cover both players' pictures.\nCARD_AREA = Box(23, 6, 5, 10)\n\n\n@dataclass(frozen=True)\nclass TrainerCardPicture:\n    \"\"\"The player on the trainer card: 8x8 tiles placed by a screen map.\n\n    Both players share one 256-color tile file, each drawing with its own\n    16-color row of the card palette. Writing lays the picture out again on the\n    player's own tiles plus the ones nobody uses, so it may grow past the\n    original silhouette without touching the other player.\n    \"\"\"\n\n    screen: int\n    other_screen: int\n    palette_row: int\n\n    def read(self, files: ArchiveFiles) -> SpriteSheet:\n        archive = self._archive(files)\n        characters = read_characters(archive[CARD_CHARACTERS])\n        screen = read_screen(archive[self.screen])\n        width, height = CARD_AREA.width * TILE_SIZE, CARD_AREA.height * TILE_SIZE\n        pixels = bytearray(width * height)\n        for column, row in _card_cells():\n            entry = screen.entries[_card_entry(screen, column, row)]\n            for tile_y in range(TILE_SIZE):\n                for tile_x in range(TILE_SIZE):\n                    source_x = TILE_SIZE - 1 - tile_x if entry.h_flip else tile_x\n                    source_y = TILE_SIZE - 1 - tile_y if entry.v_flip else tile_y\n                    value = characters.pixels[\n                        entry.tile * PIXELS_PER_TILE + source_y * TILE_SIZE + source_x\n                    ]\n                    target = (\n                        (row * TILE_SIZE + tile_y) * width + column * TILE_SIZE + tile_x\n                    )\n                    pixels[target] = (\n                        value - self._first_color if value else TRANSPARENT_INDEX\n                    )\n        colors = read_palette(archive[CARD_PALETTE]).colors\n        palette = colors[self._first_color : self._first_color + COLORS_PER_ROW]\n        return _sheet(self.screen, Box(0, 0, width, height), [bytes(pixels)], palette)\n\n    def write(self, files: ArchiveFiles, sheet: SpriteSheet) -> None:\n        archive = self._archive(files)\n        characters = bytearray(read_characters(archive[CARD_CHARACTERS]).pixels)\n        screen = read_screen(archive[self.screen])\n        blocks = self._blocks(sheet.frames[0])\n        tile_count = len(characters) // PIXELS_PER_TILE\n        tiles = self._assign_tiles(\n            screen, read_screen(archive[self.other_screen]), blocks, tile_count\n        )\n\n        entries = list(screen.entries)\n        for (column, row), tile in tiles.items():\n            entries[_card_entry(screen, column, row)] = ScreenEntry(\n                tile, False, False, 0\n            )\n            block = blocks[(column, row)]\n            if tile:\n                characters[tile * PIXELS_PER_TILE : (tile + 1) * PIXELS_PER_TILE] = (\n                    bytes(value + self._first_color if value else 0 for value in block)\n                )\n        archive[self.screen] = write_screen_entries(archive[self.screen], entries)\n        archive[CARD_CHARACTERS] = write_character_pixels(\n            archive[CARD_CHARACTERS], bytes(characters)\n        )\n        archive[CARD_PALETTE] = write_palette_colors(\n            archive[CARD_PALETTE], self._first_color, sheet.palette\n        )\n\n    @property\n    def _first_color(self) -> int:\n        return self.palette_row * COLORS_PER_ROW\n\n    def _archive(self, files: ArchiveFiles) -> list[bytes]:\n        archive = files(TRAINER_CASE_NARC)\n        _check_magic(\n            archive,\n            {\n                CARD_PALETTE: b\"RLCN\",\n                CARD_CHARACTERS: b\"RGCN\",\n                self.screen: b\"RCSN\",\n                self.other_screen: b\"RCSN\",\n            },\n        )\n        return archive\n\n    def _blocks(self, frame: bytes) -> dict[tuple[int, int], bytes]:\n        area = Box(0, 0, CARD_AREA.width * TILE_SIZE, CARD_AREA.height * TILE_SIZE)\n        return {\n            (column, row): _crop(\n                frame,\n                area,\n                Box(column * TILE_SIZE, row * TILE_SIZE, TILE_SIZE, TILE_SIZE),\n            )\n            for column, row in _card_cells()\n        }\n\n    def _assign_tiles(\n        self, screen: Screen, other_screen: Screen, blocks: dict, tile_count: int\n    ) -> dict[tuple[int, int], int]:\n        \"\"\"Keep each drawn block on the tile it already had; give new ones free tiles.\"\"\"\n        current = {\n            cell: screen.entries[_card_entry(screen, *cell)].tile\n            for cell in _card_cells()\n        }\n        taken_by_other = {entry.tile for entry in other_screen.entries}\n        own = {entry.tile for entry in screen.entries} - {0}\n        drawn = [cell for cell in _card_cells() if any(blocks[cell])]\n\n        tiles = {cell: 0 for cell in _card_cells()}\n        for cell in drawn:\n            if current[cell] in own:\n                tiles[cell] = current[cell]\n        in_use = set(tiles.values()) | taken_by_other | {0}\n        free = iter(sorted(set(range(tile_count)) - in_use))\n        for cell in drawn:\n            if not tiles[cell]:\n                tiles[cell] = next(free, 0)\n                if not tiles[cell]:\n                    raise GraphicError(\n                        \"el dibujo de la tarjeta ocupa demasiados cuadros de 8x8;\"\n                        \" deja más zonas transparentes\"\n                    )\n        return tiles\n\n\ndef _card_cells() -> list[tuple[int, int]]:\n    return [\n        (column, row)\n        for row in range(CARD_AREA.height)\n        for column in range(CARD_AREA.width)\n    ]\n\n\ndef _card_entry(screen: Screen, column: int, row: int) -> int:\n    return (CARD_AREA.y + row) * screen.width_tiles + CARD_AREA.x + column\n\n\ndef _sheet(\n    name: int, canvas: Box, frames: list[bytes], palette: list[int]\n) -> SpriteSheet:\n    return SpriteSheet(\n        name=str(name),\n        width=canvas.width,\n        height=canvas.height,\n        color0_transparent=True,\n        frames=frames,\n        palette=palette,\n    )\n\n\ndef _oam_box(oam: Oam) -> Box:\n    return Box(oam.x, oam.y, oam.width, oam.height)\n\n\ndef _oam_pixels(oam: Oam):\n    \"\"\"Yield (x, y, tile, tile_x, tile_y) for every pixel an OAM piece draws.\"\"\"\n    tiles_wide = oam.width // TILE_SIZE\n    for y in range(oam.height):\n        for x in range(oam.width):\n            source_x = oam.width - 1 - x if oam.h_flip else x\n            source_y = oam.height - 1 - y if oam.v_flip else y\n            tile = (\n                oam.first_tile\n                + (source_y // TILE_SIZE) * tiles_wide\n                + source_x // TILE_SIZE\n            )\n            yield oam.x + x, oam.y + y, tile, source_x % TILE_SIZE, source_y % TILE_SIZE\n\n\ndef _tile_pixel(characters: bytes, tile: int, x: int, y: int) -> int:\n    byte = characters[tile * BYTES_PER_4BPP_TILE + y * TILE_SIZE // 2 + x // 2]\n    return byte & 0xF if x % 2 == 0 else byte >> 4\n\n\ndef _check_drawn_inside(\n    frame: bytes, canvas: Box, boxes: list[Box], number: int\n) -> None:\n    \"\"\"The game only shows pixels inside the frame's pieces; refuse to drop others silently.\"\"\"\n    for y in range(canvas.height):\n        for x in range(canvas.width):\n            if not frame[y * canvas.width + x]:\n                continue\n            point_x, point_y = canvas.x + x, canvas.y + y\n            if not any(\n                box.x \u003c= point_x \u003c box.x + box.width\n                and box.y \u003c= point_y \u003c box.y + box.height\n                for box in boxes\n            ):\n                raise GraphicError(\n                    f\"el frame {number} tiene píxeles en ({x}, {y}), fuera del área que el juego\"\n                    \" dibuja; usa como guía el área del sprite original\"\n                )\n\n\ndef _check_key_pixels(static_frame: bytes, canvas: Box, number: int) -> None:\n    \"\"\"The game reads the encryption key from the first 4 pixels of the static\n    bitmap, so they must stay transparent.\"\"\"\n    if any(static_frame[:4]):\n        x, y = STATIC_FRAME_BOX.x - canvas.x, STATIC_FRAME_BOX.y - canvas.y\n        raise GraphicError(\n            f\"el frame {number} debe dejar transparentes los píxeles ({x}, {y}) a ({x + 3}, {y}):\"\n            \" el juego los usa para descifrar su sprite fijo de batalla\"\n        )\n\n\ndef _place(pixels: bytes, box: Box, canvas: Box) -> bytes:\n    frame = bytearray(canvas.width * canvas.height)\n    for row in range(box.height):\n        start = (box.y - canvas.y + row) * canvas.width + (box.x - canvas.x)\n        frame[start : start + box.width] = pixels[\n            row * box.width : (row + 1) * box.width\n        ]\n    return bytes(frame)\n\n\ndef _crop(frame: bytes, canvas: Box, box: Box) -> bytes:\n    rows = []\n    for row in range(box.height):\n        start = (box.y - canvas.y + row) * canvas.width + (box.x - canvas.x)\n        rows.append(frame[start : start + box.width])\n    return b\"\".join(rows)\n\n\ndef _check_magic(archive: list[bytes], expected: dict[int, bytes]) -> None:\n    for index, magic in expected.items():\n        if index >= len(archive) or archive[index][:4] != magic:\n            raise GraphicError(\n                f\"el archivo {index} no tiene el formato esperado;\"\n                \" la ROM parece modificada de una forma que esta herramienta no reconoce\"\n            )\n", "species.py": "\"\"\"Pokémon species names by National Pokédex number, up to Generation V.\n\nSpanish names, which match the English ones for every species up to #649\n(source: PokeAPI's pokemon_species_names.csv).\n\"\"\"\n\nNAMES = (\n    None,\n    \"Bulbasaur\",\n    \"Ivysaur\",\n    \"Venusaur\",\n    \"Charmander\",\n    \"Charmeleon\",\n    \"Charizard\",\n    \"Squirtle\",\n    \"Wartortle\",\n    \"Blastoise\",\n    \"Caterpie\",\n    \"Metapod\",\n    \"Butterfree\",\n    \"Weedle\",\n    \"Kakuna\",\n    \"Beedrill\",\n    \"Pidgey\",\n    \"Pidgeotto\",\n    \"Pidgeot\",\n    \"Rattata\",\n    \"Raticate\",\n    \"Spearow\",\n    \"Fearow\",\n    \"Ekans\",\n    \"Arbok\",\n    \"Pikachu\",\n    \"Raichu\",\n    \"Sandshrew\",\n    \"Sandslash\",\n    \"Nidoran♀\",\n    \"Nidorina\",\n    \"Nidoqueen\",\n    \"Nidoran♂\",\n    \"Nidorino\",\n    \"Nidoking\",\n    \"Clefairy\",\n    \"Clefable\",\n    \"Vulpix\",\n    \"Ninetales\",\n    \"Jigglypuff\",\n    \"Wigglytuff\",\n    \"Zubat\",\n    \"Golbat\",\n    \"Oddish\",\n    \"Gloom\",\n    \"Vileplume\",\n    \"Paras\",\n    \"Parasect\",\n    \"Venonat\",\n    \"Venomoth\",\n    \"Diglett\",\n    \"Dugtrio\",\n    \"Meowth\",\n    \"Persian\",\n    \"Psyduck\",\n    \"Golduck\",\n    \"Mankey\",\n    \"Primeape\",\n    \"Growlithe\",\n    \"Arcanine\",\n    \"Poliwag\",\n    \"Poliwhirl\",\n    \"Poliwrath\",\n    \"Abra\",\n    \"Kadabra\",\n    \"Alakazam\",\n    \"Machop\",\n    \"Machoke\",\n    \"Machamp\",\n    \"Bellsprout\",\n    \"Weepinbell\",\n n    \"Liepard\",\n    \"Pansage\",\n    \"Simisage\",\n    \"Pansear\",\n    \"Simisear\",\n    \"Panpour\",\n    \"Simipour\",\n    \"Munna\",\n    \"Musharna\",\n    \"Pidove\",\n    \"Tranquill\",\n    \"Unfezant\",\n    \"Blitzle\",\n    \"Zebstrika\",\n    \"Roggenrola\",\n    \"Boldore\",\n    \"Gigalith\",\n    \"Woobat\",\n    \"Swoobat\",\n    \"Drilbur\",\n    \"Excadrill\",\n    \"Audino\",\n    \"Timburr\",\n    \"Gurdurr\",\n    \"Conkeldurr\",\n    \"Tympole\",\n    \"Palpitoad\",\n    \"Seismitoad\",\n    \"Throh\",\n    \"Sawk\",\n    \"Sewaddle\",\n    \"Swadloon\",\n    \"Leavanny\",\n    \"Venipede\",\n    \"Whirlipede\",\n    \"Scolipede\",\n    \"Cottonee\",\n    \"Whimsicott\",\n    \"Petilil\",\n    \"Lilligant\",\n    \"Basculin\",\n    \"Sandile\",\n    \"Krokorok\",\n    \"Krookodile\",\n    \"Darumaka\",\n    \"Darmanitan\",\n    \"Maractus\",\n    \"Dwebble\",\n    \"Crustle\",\n    \"Scraggy\",\n    \"Scrafty\",\n    \"Sigilyph\",\n    \"Yamask\",\n    \"Cofagrigus\",\n    \"Tirtouga\",\n    \"Carracosta\",\n    \"Archen\",\n    \"Archeops\",\n    \"Trubbish\",\n    \"Garbodor\",\n    \"Zorua\",\n    \"Zoroark\",\n    \"Minccino\",\n    \"Cinccino\",\n    \"Gothita\",\n    \"Gothorita\",\n    \"Gothitelle\",\n    \"Solosis\",\n    \"Duosion\",\n    \"Reuniclus\",\n    \"Ducklett\",\n    \"Swanna\",\n    \"Vanillite\",\n    \"Vanillish\",\n    \"Vanilluxe\",\n    \"Deerling\",\n    \"Sawsbuck\",\n    \"Emolga\",\n    \"Karrablast\",\n    \"Escavalier\",\n    \"Foongus\",\n    \"Amoonguss\",\n    \"Frillish\",\n    \"Jellicent\",\n    \"Alomomola\",\n    \"Joltik\",\n    \"Galvantula\",\n    \"Ferroseed\",\n    \"Ferrothorn\",\n    \"Klink\",\n    \"Klang\",\n    \"Klinklang\",\n    \"Tynamo\",\n    \"Eelektrik\",\n    \"Eelektross\",\n    \"Elgyem\",\n    \"Beheeyem\",\n    \"Litwick\",\n    \"Lampent\",\n    \"Chandelure\",\n    \"Axew\",\n    \"Fraxure\",\n    \"Haxorus\",\n    \"Cubchoo\",\n    \"Beartic\",\n    \"Cryogonal\",\n    \"Shelmet\",\n    \"Accelgor\",\n    \"Stunfisk\",\n    \"Mienfoo\",\n    \"Mienshao\",\n    \"Druddigon\",\n    \"Golett\",\n    \"Golurk\",\n    \"Pawniard\",\n    \"Bisharp\",\n    \"Bouffalant\",\n    \"Rufflet\",\n    \"Braviary\",\n    \"Vullaby\",\n    \"Mandibuzz\",\n    \"Heatmor\",\n    \"Durant\",\n    \"Deino\",\n    \"Zweilous\",\n    \"Hydreigon\",\n    \"Larvesta\",\n    \"Volcarona\",\n    \"Cobalion\",\n    \"Terrakion\",\n    \"Virizion\",\n    \"Tornadus\",\n    \"Thundurus\",\n    \"Reshiram\",\n    \"Zekrom\",\n    \"Landorus\",\n    \"Kyurem\",\n    \"Keldeo\",\n    \"Meloetta\",\n    \"Genesect\",\n)\n\n\ndef species_name(number: int) -> str:\n    return NAMES[number] if 0 \u003c number \u003c len(NAMES) else f\"#{number}\"\n", "starters.py": "\"\"\"Choosing the three starter Pokémon: what every game shares.\n\nSpecies are always National Pokédex numbers here; each game's editor converts\nthem to its own internal IDs.\n\"\"\"\n\nfrom platsprites.sheet import PlatspritesError\nfrom platsprites.species import NAMES, species_name\n\nSTARTER_COUNT = 3\n\n\nclass StarterError(PlatspritesError):\n    pass\n\n\ndef parse_species(value: str, max_species: int) -> int:\n    \"\"\"A species from its National Pokédex number or its name, e.g. \"25\" or \"pikachu\".\"\"\"\n    text = value.strip()\n    if text.isdigit():\n        number = int(text)\n    else:\n        by_name = {name.lower(): number for number, name in enumerate(NAMES) if name}\n        number = by_name.get(text.lower())\n        if number is None:\n            raise StarterError(f\"no conozco el Pokémon '{value}'\")\n    return _check_species(number, max_species)\n\n\ndef validate_starters(species: list[int], max_species: int) -> list[int]:\n    if len(species) != STARTER_COUNT:\n        raise StarterError(f\"elige exactamente {STARTER_COUNT} iniciales\")\n    if len(set(species)) != STARTER_COUNT:\n        # Several games pick the rival's team by comparing the player's species.\n        raise StarterError(\"elige 3 Pokémon distintos\")\n    return [_check_species(number, max_species) for number in species]\n\n\ndef describe(species: list[int]) -> str:\n    return \", \".join(f\"{species_name(number)} (#{number})\" for number in species)\n\n\ndef _check_species(number: int, max_species: int) -> int:\n    if not 1 \u003c= number \u003c= max_species:\n        raise StarterError(\n            f\"#{number} no existe en este juego; elige un número del 1 al {max_species}\"\n        )\n    return number\n", "nitro2d.py": "\"\"\"Read and patch the 2D graphics files of the DS SDK: NCLR, NCGR, NCER and NSCR.\n\nOnly the parts the sprite slots need are modeled. Writers patch the original\nbytes in place, so headers, padding and unknown fields stay as the game shipped\nthem.\n\"\"\"\n\nimport struct\nfrom dataclasses import dataclass\n\nfrom platsprites.sheet import PlatspritesError\n\nNITRO_HEADER_SIZE = 0x10\nBLOCK_HEADER_SIZE = 0x08\nTILE_SIZE = 8\nBYTES_PER_4BPP_TILE = 32\n# NCGR bit depth field -> bits per pixel.\nBITS_PER_PIXEL = {3: 4, 4: 8}\n\n# OAM (width, height) indexed by [shape][size].\nOAM_DIMENSIONS = [\n    [(8, 8), (16, 16), (32, 32), (64, 64)],\n    [(16, 8), (32, 8), (32, 16), (64, 32)],\n    [(8, 16), (8, 32), (16, 32), (32, 64)],\n]\n\n\nclass Nitro2dError(PlatspritesError):\n    pass\n\n\ndef _block(data: bytes, magic: bytes) -> int:\n    \"\"\"Offset of the first byte after the header of the block named `magic`.\"\"\"\n    if len(data) \u003c NITRO_HEADER_SIZE:\n        raise Nitro2dError(\"archivo gráfico demasiado corto\")\n    offset = struct.unpack_from(\"\u003cH\", data, 0x0C)[0]\n    while offset + BLOCK_HEADER_SIZE \u003c= len(data):\n        block_magic, size = struct.unpack_from(\"\u003c4sI\", data, offset)\n        if block_magic == magic:\n            return offset + BLOCK_HEADER_SIZE\n        if size \u003c BLOCK_HEADER_SIZE:\n            break\n        offset += size\n    raise Nitro2dError(f\"no se encontró el bloque {magic.decode()}\")\n\n\n@dataclass\nclass Palette:\n    \"\"\"NCLR: BGR555 colors; `colors_offset` is where they live in the file.\"\"\"\n\n    colors: list[int]\n    colors_offset: int\n\n\ndef read_palette(data: bytes) -> Palette:\n    start = _block(data, b\"TTLP\")\n    size, colors_relative_offset = struct.unpack_from(\"\u003cII\", data, start + 0x08)\n    colors_offset = start + colors_relative_offset\n    count = size // 2\n    return Palette(\n        list(struct.unpack_from(f\"\u003c{count}H\", data, colors_offset)), colors_offset\n    )\n\n\ndef write_palette_colors(data: bytes, first_color: int, colors: list[int]) -> bytes:\n    \"\"\"Return `data` with `colors` written from color number `first_color` on.\"\"\"\n    palette = read_palette(data)\n    if first_color + len(colors) > len(palette.colors):\n        raise Nitro2dError(\"la paleta no tiene espacio para esos colores\")\n    result = bytearray(data)\n    struct.pack_into(\n        f\"\u003c{len(colors)}H\", result, palette.colors_offset + 2 * first_color, *colors\n    )\n    return bytes(result)\n\n\n@dataclass\nclass CharacterData:\n    \"\"\"NCGR: 4bpp or 8bpp pixel data, either as 8x8 tiles or as a scanned bitmap.\"\"\"\n\n    width_tiles: int\n    height_tiles: int\n    bits_per_pixel: int\n    scanned: bool\n    pixels_offset: int\n    pixels: bytes\n\n\ndef read_characters(data: bytes) -> CharacterData:\n    start = _block(data, b\"RAHC\")\n    height, width, bit_depth, _mapping, scanned, size, relative_offset = (\n        struct.unpack_from(\"\u003cHHIIIII\", data, start)\n    )\n    if bit_depth not in BITS_PER_PIXEL:\n        raise Nitro2dError(f\"profundidad de color desconocida ({bit_depth})\")\n    pixels_offset = start + relative_offset\n    return CharacterData(\n        width_tiles=width,\n        height_tiles=height,\n        bits_per_pixel=BITS_PER_PIXEL[bit_depth],\n        scanned=bool(scanned & 1),\n        pixels_offset=pixels_offset,\n        pixels=data[pixels_offset : pixels_offset + size],\n    )\n\n\ndef write_character_pixels(data: bytes, pixels: bytes) -> bytes:\n    characters = read_characters(data)\n    if len(pixels) != len(characters.pixels):\n        raise Nitro2dError(\"los nuevos píxeles no ocupan lo mismo que los originales\")\n    start = characters.pixels_offset\n    return data[:start] + pixels + data[start + len(pixels) :]\n\n\n@dataclass\nclass Oam:\n    x: int\n    y: int\n    width: int\n    height: int\n    first_tile: int\n    h_flip: bool\n    v_flip: bool\n\n\n@dataclass\nclass Cell:\n    oams: list[Oam]\n\n\ndef read_cells(data: bytes) -> list[Cell]:\n    start = _block(data, b\"KBEC\")\n    count, attributes, cells_relative_offset, mapping, transfer_offset = (\n        struct.unpack_from(\"\u003cHHIII\", data, start)\n    )\n    cells_start = start + cells_relative_offset\n    cell_entry_size = 16 if attributes & 1 else 8\n    oams_start = cells_start + cell_entry_size * count\n    # 1D OBJ mapping: character names count in units of 32 \u003c\u003c mapping bytes.\n    tiles_per_name = (32 \u003c\u003c (mapping & 3)) // BYTES_PER_4BPP_TILE\n    first_tiles = _transfer_first_tiles(data, start, transfer_offset, count)\n    cells = []\n    for index in range(count):\n        oam_count, _, oam_offset = struct.unpack_from(\n            \"\u003cHHI\", data, cells_start + cell_entry_size * index\n        )\n        oams = [\n            _read_oam(\n                data,\n                oams_start + oam_offset + 6 * i,\n                tiles_per_name,\n                first_tiles[index],\n            )\n            for i in range(oam_count)\n        ]\n        cells.append(Cell(oams))\n    return cells\n\n\ndef _transfer_first_tiles(\n    data: bytes, start: int, transfer_offset: int, count: int\n) -> list[int]:\n    \"\"\"Animated sprites copy each cell's own tiles into the same VRAM slots before\n    drawing it; the NCER lists where in the NCGR each cell's tiles start.\"\"\"\n    if not transfer_offset:\n        return [0] * count\n    table = start + transfer_offset + 8\n    return [\n        struct.unpack_from(\"\u003cI\", data, table + 8 * index)[0] // BYTES_PER_4BPP_TILE\n        for index in range(count)\n    ]\n\n\ndef _read_oam(data: bytes, offset: int, tiles_per_name: int, first_tile: int) -> Oam:\n    attr0, attr1, attr2 = struct.unpack_from(\"\u003cHHH\", data, offset)\n    if attr0 & 0x0100:\n        raise Nitro2dError(\"sprites con rotación no soportados\")\n    if (attr0 >> 13) & 1:\n        raise Nitro2dError(\"sprites de 256 colores no soportados\")\n    y = attr0 & 0xFF\n    x = attr1 & 0x1FF\n    width, height = OAM_DIMENSIONS[(attr0 >> 14) & 3][(attr1 >> 14) & 3]\n    return Oam(\n        x=x - 0x200 if x >= 0x100 else x,\n        y=y - 0x100 if y >= 0x80 else y,\n        width=width,\n        height=height,\n        first_tile=first_tile + (attr2 & 0x3FF) * tiles_per_name,\n        h_flip=bool(attr1 & 0x1000),\n        v_flip=bool(attr1 & 0x2000),\n    )\n\n\n@dataclass\nclass ScreenEntry:\n    tile: int\n    h_flip: bool\n    v_flip: bool\n    palette: int\n\n\n@dataclass\nclass Screen:\n    \"\"\"NSCR: a map of `width_tiles` x `height_tiles` entries.\"\"\"\n\n    width_tiles: int\n    height_tiles: int\n    entries: list[ScreenEntry]\n\n\ndef read_screen(data: bytes) -> Screen:\n    start = _block(data, b\"NRCS\")\n    width, height, _format, _unused, size = struct.unpack_from(\"\u003cHHHHI\", data, start)\n    raw = struct.unpack_from(f\"\u003c{size // 2}H\", data, start + 0x0C)\n    entries = [\n        ScreenEntry(\n            tile=value & 0x3FF,\n            h_flip=bool(value & 0x400),\n            v_flip=bool(value & 0x800),\n            palette=value >> 12,\n        )\n        for value in raw\n    ]\n    return Screen(width // TILE_SIZE, height // TILE_SIZE, entries)\n\n\ndef write_screen_entries(data: bytes, entries: list[ScreenEntry]) -> bytes:\n    start = _block(data, b\"NRCS\")\n    values = [\n        entry.tile | entry.h_flip \u003c\u003c 10 | entry.v_flip \u003c\u003c 11 | entry.palette \u003c\u003c 12\n        for entry in entries\n    ]\n    result = bytearray(data)\n    struct.pack_into(f\"\u003c{len(values)}H\", result, start + 0x0C, *values)\n    return bytes(result)\n\n\ndef decrypt_scanned(pixels: bytes) -> bytes:\n    \"\"\"Undo the XOR stream that hides scanned trainer sprites (\"front to back\").\"\"\"\n    words = struct.unpack(f\"\u003c{len(pixels) // 2}H\", pixels)\n    state = words[0]\n    plain = []\n    for word in words:\n        plain.append(word ^ (state & 0xFFFF))\n        state = (state * 1103515245 + 24691) & 0xFFFFFFFF\n    return struct.pack(f\"\u003c{len(plain)}H\", *plain)\n\n\ndef encrypt_scanned(plain: bytes, seed: int) -> bytes:\n    \"\"\"Inverse of decrypt_scanned; the game recovers `seed` from the first word.\"\"\"\n    words = struct.unpack(f\"\u003c{len(plain) // 2}H\", plain)\n    if words[0] != 0:\n        raise Nitro2dError(\n            \"los primeros 4 píxeles (arriba a la izquierda) deben ser transparentes\"\n        )\n    state = seed\n    encrypted = []\n    for word in words:\n        encrypted.append(word ^ (state & 0xFFFF))\n        state = (state * 1103515245 + 24691) & 0xFFFFFFFF\n    return struct.pack(f\"\u003c{len(encrypted)}H\", *encrypted)\n", "__init__.py": "", "games.py": "\"\"\"The supported games and the graphics each one lets you replace, by category.\n\nPlatinum locations come from pret/pokeplatinum (field_sprites.order,\nfield_encounteffect.order, trainer_case.order, generated/trainer_classes.txt and\nsrc/applications/trainer_case/main.c); HeartGold/SoulSilver ones from\npret/pokeheartgold (include/constants/mmodel.h and src/player_avatar.c).\n\"\"\"\n\nfrom dataclasses import dataclass\nfrom pathlib import Path\n\nfrom ndspy.code import Overlay, saveOverlayTable\nfrom ndspy.narc import NARC\nfrom ndspy.rom import NintendoDSRom\n\nfrom platsprites.ds_starters import BlackWhiteStarters, PlatinumStarters\nfrom platsprites.gba import (\n    PAL_TAG_BRENDAN,\n    PAL_TAG_MAY,\n    PAL_TAG_PLAYER_UNDERWATER,\n    GbaGame,\n    GbaRom,\n    ObjectEventSprite,\n    is_gba_rom,\n)\nfrom platsprites.gba_starters import EmeraldStarters\nfrom platsprites.graphics import (\n    FILES_PER_TRAINER_CLASS,\n    TRAINER_BACK_NARC,\n    TRAINER_FRONT_NARC,\n    Mugshot,\n    OverworldSprite,\n    TrainerBattleSprite,\n    TrainerCardPicture,\n)\nfrom platsprites.sheet import PlatspritesError, SpriteSheet\n\n\nclass RomError(PlatspritesError):\n    pass\n\n\nCATEGORIES = {\n    \"mapa\": \"Mapa\",\n    \"tarjeta\": \"Tarjeta de entrenador\",\n    \"vs\": \"Pantalla VS\",\n    \"espalda\": \"De espaldas en combate\",\n    \"lideres\": \"Líderes de gimnasio\",\n    \"alto-mando\": \"Alto Mando\",\n    \"campeona\": \"Campeona\",\n}\n\n\n@dataclass(frozen=True)\nclass Slot:\n    name: str\n    description: str\n    category: str\n    graphic: (\n        OverworldSprite\n        | Mugshot\n        | TrainerBattleSprite\n        | TrainerCardPicture\n        | ObjectEventSprite\n    )\n\n\n@dataclass(frozen=True)\nclass Game:\n    name: str\n    game_codes: tuple[bytes, ...]\n    slots: list[Slot]\n    # Reads and writes the 3 starters (and the rival teams that depend on them).\n    starters: object | None = None\n    max_species: int = 0\n\n    @property\n    def slots_by_name(self) -> dict[str, Slot]:\n        return {slot.name: slot for slot in self.slots}\n\n\ndef _overworld(\n    narc: str, name: str, description: str, index: int, texture: str\n) -> Slot:\n    return Slot(name, description, \"mapa\", OverworldSprite(narc, index, texture))\n\n\ndef _rival(\n    name: str,\n    description: str,\n    category: str,\n    class_index: int,\n    static_frames: tuple[int | None, int | None],\n) -> Slot:\n    first_file = class_index * FILES_PER_TRAINER_CLASS\n    return Slot(\n        name,\n        description,\n        category,\n        TrainerBattleSprite(TRAINER_FRONT_NARC, first_file, static_frames),\n    )\n\n\nPLATINUM_MAP = \"data/mmodel/mmodel.narc\"\nPLATINUM_ENCOUNTER_EFFECTS = \"graphic/field_encounteffect.narc\"\n\nPLATINUM = Game(\n    name=\"Pokémon Platino\",\n    game_codes=(b\"CPU\",),\n    slots=[\n        _overworld(PLATINUM_MAP, \"boy\", \"chico caminando/corriendo\", 90, \"pl_boy01c\"),\n        _overworld(PLATINUM_MAP, \"girl\", \"chica caminando/corriendo\", 91, \"pl_girl01c\"),\n        _overworld(PLATINUM_MAP, \"boy-bike\", \"chico en bici\", 92, \"pl_cyclehero\"),\n        _overworld(PLATINUM_MAP, \"girl-bike\", \"chica en bici\", 93, \"pl_cycheroine\"),\n        _overworld(\n            PLATINUM_MAP, \"boy-pokeball\", \"chico sacando Poké Ball\", 155, \"pl_sphero\"\n        ),\n        _overworld(\n            PLATINUM_MAP,\n            \"girl-pokeball\",\n            \"chica sacando Poké Ball\",\n            156,\n            \"pl_spheroine\",\n        ),\n        _overworld(\n            PLATINUM_MAP,\n            \"boy-sprayduck\",\n            \"chico regando con Psydugadera\",\n            157,\n            \"pl_whelo\",\n        ),\n        _overworld(\n            PLATINUM_MAP,\n            \"girl-sprayduck\",\n            \"chica regando con Psydugadera\",\n            158,\n            \"pl_wheroine\",\n        ),\n        _overworld(PLATINUM_MAP, \"boy-surf\", \"chico surfeando\", 159, \"pl_swimhiro\"),\n        _overworld(PLATINUM_MAP, \"girl-surf\", \"chica surfeando\", 160, \"pl_swimhiroine\"),\n        _overworld(\n            PLATINUM_MAP,\n            \"boy-contest\",\n            \"chico con traje de concurso\",\n            164,\n            \"contesthero\",\n        ),\n        _overworld(\n            PLATINUM_MAP,\n            \"girl-contest\",\n            \"chica con traje de concurso\",\n            165,\n            \"cont_heroine\",\n        ),\n        _overworld(PLATINUM_MAP, \"boy-fishing\", \"chico pescando\", 166, \"pl_fishhero\"),\n        _overworld(PLATINUM_MAP, \"girl-fishing\", \"chica pescando\", 167, \"pl_fheroine\"),\n        _overworld(\n            PLATINUM_MAP, \"boy-poketch\", \"chico usando el Pokétch\", 363, \"pl_pokehero\"\n        ),\n        _overworld(\n            PLATINUM_MAP, \"girl-poketch\", \"chica usando el Pokétch\", 364, \"pl_pkheroine\"\n        ),\n        _overworld(\n            PLATINUM_MAP, \"boy-save\", \"chico guardando partida\", 365, \"pl_savehero\"\n        ),\n        _overworld(\n            PLATINUM_MAP, \"girl-save\", \"chica guardando partida\", 366, \"pl_saveheroine\"\n        ),\n        _overworld(\n            PLATINUM_MAP,\n            \"boy-pokecenter\",\n            \"chico en el Centro Pokémon\",\n            367,\n            \"pl_banhero\",\n        ),\n        _overworld(\n            PLATINUM_MAP,\n            \"girl-pokecenter\",\n            \"chica en el Centro Pokémon\",\n            368,\n            \"pl_banheroine\",\n        ),\n        _overworld(\n            PLATINUM_MAP,\n            \"boy-vs-seeker\",\n            \"chico usando el Buscapelea\",\n            415,\n            \"pl_bshero\",\n        ),\n        _overworld(\n            PLATINUM_MAP,\n            \"girl-vs-seeker\",\n            \"chica usando el Buscapelea\",\n            416,\n            \"pl_bsheroine\",\n        ),\n        Slot(\n            \"card-boy\",\n            \"chico en la tarjeta de entrenador\",\n            \"tarjeta\",\n            TrainerCardPicture(screen=40, other_screen=41, palette_row=4),\n        ),\n        Slot(\n            \"card-girl\",\n            \"chica en la tarjeta de entrenador\",\n            \"tarjeta\",\n            TrainerCardPicture(screen=41, other_screen=40, palette_row=5),\n        ),\n        Slot(\n            \"vs-boy\",\n            \"retrato del chico antes de líderes, Alto Mando y campeona\",\n            \"vs\",\n            Mugshot(PLATINUM_ENCOUNTER_EFFECTS, nclr=147, ncgr=148, ncer=149),\n        ),\n        Slot(\n            \"vs-girl\",\n            \"retrato de la chica antes de líderes, Alto Mando y campeona\",\n            \"vs\",\n            Mugshot(PLATINUM_ENCOUNTER_EFFECTS, nclr=151, ncgr=152, ncer=153),\n        ),\n        Slot(\n            \"back-boy\",\n            \"chico de espaldas al empezar el combate y al lanzar una Poké Ball\",\n            \"espalda\",\n            # trbgra lists only classes with a back sprite; the player's are the first two.\n            TrainerBattleSprite(TRAINER_BACK_NARC, first_file=0, static_frames=(0, 1)),\n        ),\n        Slot(\n            \"back-girl\",\n            \"chica de espaldas al empezar el combate y al lanzar una Poké Ball\",\n            \"espalda\",\n            TrainerBattleSprite(\n                TRAINER_BACK_NARC,\n                first_file=FILES_PER_TRAINER_CLASS,\n                static_frames=(0, 1),\n            ),\n        ),\n        _rival(\"leader-roark\", \"Roark, Ciudad Pirita\", \"lideres\", 62, (0, None)),\n        _rival(\"leader-gardenia\", \"Gardenia, Ciudad Vetusta\", \"lideres\", 74, (3, 1)),\n        _rival(\"leader-fantina\", \"Fantina, Ciudad Corazón\", \"lideres\", 77, (5, 0)),\n        _rival(\"leader-maylene\", \"Maylene, Ciudad Rocavelo\", \"lideres\", 76, (0, 2)),\n        _rival(\"leader-wake\", \"Crasher Wake, Ciudad Pradera\", \"lideres\", 75, (1, 2)),\n        _rival(\"leader-byron\", \"Byron, Ciudad Canal\", \"lideres\", 64, (0, 2)),\n        _rival(\"leader-candice\", \"Candice, Ciudad Puntaneva\", \"lideres\", 78, (3, 5)),\n        _rival(\"leader-volkner\", \"Volkner, Ciudad Marina\", \"lideres\", 79, (5, 3)),\n        _rival(\"elite-aaron\", \"Aaron, tipo bicho\", \"alto-mando\", 65, (1, 4)),\n        _rival(\"elite-bertha\", \"Bertha, tipo tierra\", \"alto-mando\", 66, (0, 1)),\n        _rival(\"elite-flint\", \"Flint, tipo fuego\", \"alto-mando\", 67, (0, 2)),\n        _rival(\"elite-lucian\", \"Lucian, tipo psíquico\", \"alto-mando\", 68, (0, 1)),\n        _rival(\n            \"champion-cynthia\", \"Cynthia, campeona de Sinnoh\", \"campeona\", 69, (0, 1)\n        ),\n    ],\n    starters=PlatinumStarters(),\n    max_species=493,\n)\n\nHGSS_MAP = \"a/0/8/1\"\n\nHEARTGOLD_SOULSILVER = Game(\n    name=\"Pokémon HeartGold/SoulSilver\",\n    game_codes=(b\"IPK\", b\"IPG\"),\n    slots=[\n        _overworld(HGSS_MAP, \"boy\", \"chico caminando/corriendo\", 69, \"hero\"),\n        _overworld(HGSS_MAP, \"girl\", \"chica caminando/corriendo\", 70, \"heroine\"),\n        _overworld(HGSS_MAP, \"boy-bike\", \"chico en bici\", 71, \"cyclehero\"),\n        _overworld(HGSS_MAP, \"girl-bike\", \"chica en bici\", 72, \"cycleheroine\"),\n        _overworld(HGSS_MAP, \"boy-surf\", \"chico surfeando\", 73, \"swimhero\"),\n        _overworld(HGSS_MAP, \"girl-surf\", \"chica surfeando\", 74, \"swimheroine\"),\n        _overworld(HGSS_MAP, \"boy-pokeball\", \"chico usando una MO\", 75, \"sphero\"),\n        _overworld(HGSS_MAP, \"girl-pokeball\", \"chica usando una MO\", 76, \"spheroine\"),\n        _overworld(HGSS_MAP, \"boy-watering\", \"chico regando\", 77, \"waterhero\"),\n        _overworld(HGSS_MAP, \"girl-watering\", \"chica regando\", 78, \"waterheroine\"),\n        _overworld(HGSS_MAP, \"boy-fishing\", \"chico pescando\", 79, \"fishinghero\"),\n        _overworld(HGSS_MAP, \"girl-fishing\", \"chica pescando\", 80, \"fish_heroine\"),\n        _overworld(HGSS_MAP, \"boy-ladder\", \"chico en una escalera\", 81, \"ladderhero\"),\n        _overworld(\n            HGSS_MAP, \"girl-ladder\", \"chica en una escalera\", 82, \"ladderheroine\"\n        ),\n        _overworld(\n            HGSS_MAP, \"boy-pokegear\", \"chico usando el Pokégear\", 85, \"pokehero\"\n        ),\n        _overworld(\n            HGSS_MAP, \"girl-pokegear\", \"chica usando el Pokégear\", 86, \"pokeheroine\"\n        ),\n        _overworld(HGSS_MAP, \"boy-save\", \"chico guardando partida\", 87, \"savehero\"),\n        _overworld(HGSS_MAP, \"girl-save\", \"chica guardando partida\", 88, \"saveheroine\"),\n        _overworld(\n            HGSS_MAP, \"boy-pokecenter\", \"chico en el Centro Pokémon\", 89, \"banzaihero\"\n        ),\n        _overworld(\n            HGSS_MAP,\n            \"girl-pokecenter\",\n            \"chica en el Centro Pokémon\",\n            90,\n            \"banzaiheroine\",\n        ),\n        _overworld(\n            HGSS_MAP, \"boy-rocket\", \"chico disfrazado del Team Rocket\", 95, \"rhero\"\n        ),\n        _overworld(\n            HGSS_MAP, \"girl-rocket\", \"chica disfrazada del Team Rocket\", 96, \"rheroine\"\n        ),\n        _overworld(\n            HGSS_MAP,\n            \"boy-rocket-pokecenter\",\n            \"chico Rocket en el Centro Pokémon\",\n            97,\n            \"rbanzaihero\",\n        ),\n        _overworld(\n            HGSS_MAP,\n            \"girl-rocket-pokecenter\",\n            \"chica Rocket en el Centro Pokémon\",\n            98,\n            \"rbanzaiine\",\n        ),\n        _overworld(\n            HGSS_MAP, \"boy-pokeathlon\", \"chico en el Pokéathlon\", 99, \"pkthhero\"\n        ),\n        _overworld(\n            HGSS_MAP, \"girl-pokeathlon\", \"chica en el Pokéathlon\", 100, \"pkthheroine\"\n        ),\n        _overworld(\n            HGSS_MAP,\n            \"boy-apricorn\",\n            \"chico sacudiendo un árbol de bonguri\",\n            207,\n            \"shakehero\",\n        ),\n        _overworld(\n            HGSS_MAP,\n            \"girl-apricorn\",\n            \"chica sacudiendo un árbol de bonguri\",\n            208,\n            \"shakeheroine\",\n        ),\n        _overworld(\n            HGSS_MAP,\n            \"boy-rocket-save\",\n            \"chico Rocket guardando partida\",\n            248,\n            \"saverhero\",\n        ),\n        _overworld(\n            HGSS_MAP,\n            \"girl-rocket-save\",\n            \"chica Rocket guardando partida\",\n            249,\n            \"saverheroine\",\n        ),\n    ],\n)\n\nBW_MAP = \"a/0/4/9\"\n\n# Black/White have no decompilation; these indexes were mapped by rendering a\n# Black (Spain) ROM's overworld archive. Each state comes as a boy/girl pair and\n# both share the same internal texture name.\nBLACK_WHITE = Game(\n    name=\"Pokémon Negro/Blanco\",\n    game_codes=(b\"IRB\", b\"IRA\"),\n    slots=[\n        _overworld(BW_MAP, \"boy\", \"chico caminando/corriendo\", 6, \"t4x4hero\"),\n        _overworld(BW_MAP, \"girl\", \"chica caminando/corriendo\", 9, \"t4x4hero\"),\n        _overworld(BW_MAP, \"boy-bike\", \"chico en bici\", 7, \"t4x4cycle\"),\n        _overworld(BW_MAP, \"girl-bike\", \"chica en bici\", 10, \"t4x4cycle\"),\n        _overworld(BW_MAP, \"boy-surf\", \"chico surfeando\", 8, \"t4x4swim\"),\n        _overworld(BW_MAP, \"girl-surf\", \"chica surfeando\", 11, \"t4x4swim\"),\n        _overworld(\n            BW_MAP, \"boy-item\", \"chico recibiendo un objeto\", 136, \"t4x4gethero\"\n        ),\n        _overworld(\n            BW_MAP, \"girl-item\", \"chica recibiendo un objeto\", 137, \"t4x4gethero\"\n        ),\n        _overworld(\n            BW_MAP, \"boy-save\", \"chico guardando partida\", 138, \"t4x4reporthero\"\n        ),\n        _overworld(\n            BW_MAP, \"girl-save\", \"chica guardando partida\", 139, \"t4x4reporthero\"\n        ),\n        _overworld(\n            BW_MAP, \"boy-pokecenter\", \"chico en el Centro Pokémon\", 140, \"t4x4pchero\"\n        ),\n        _overworld(\n            BW_MAP, \"girl-pokecenter\", \"chica en el Centro Pokémon\", 141, \"t4x4pchero\"\n        ),\n        _overworld(BW_MAP, \"boy-pokeball\", \"chico usando una MO\", 152, \"t4x4cutinhero\"),\n        _overworld(\n            BW_MAP, \"girl-pokeball\", \"chica usando una MO\", 153, \"t4x4cutinhero\"\n        ),\n        _overworld(BW_MAP, \"boy-spin\", \"chico girando\", 154, \"t4x4hurahero\"),\n        _overworld(BW_MAP, \"girl-spin\", \"chica girando\", 155, \"t4x4hurahero\"),\n        _overworld(BW_MAP, \"boy-fishing\", \"chico pescando\", 156, \"t8x8fishgirl\"),\n        _overworld(BW_MAP, \"girl-fishing\", \"chica pescando\", 157, \"t8x8fishgirl\"),\n    ],\n    starters=BlackWhiteStarters(),\n    max_species=649,\n)\n\nGAMES = [PLATINUM, HEARTGOLD_SOULSILVER, BLACK_WHITE]\n\n\ndef _object_event(name: str, description: str, gfx: int, frames: int) -> Slot:\n    return Slot(name, description, \"mapa\", ObjectEventSprite(gfx, frames))\n\n\n# Graphics info indexes (OBJ_EVENT_GFX_*) and frame counts from pret/pokeemerald.\nEMERALD = GbaGame(\n    name=\"Pokémon Esmeralda\",\n    game_codes=(b\"BPE\",),\n    slots=[\n        _object_event(\"boy\", \"chico caminando/corriendo\", 0, 18),\n        _object_event(\"girl\", \"chica caminando/corriendo\", 89, 18),\n        _object_event(\"boy-bike\", \"chico en bici de carreras\", 1, 9),\n        _object_event(\"girl-bike\", \"chica en bici de carreras\", 90, 9),\n        _object_event(\"boy-acro-bike\", \"chico en bici acrobática\", 63, 27),\n        _object_event(\"girl-acro-bike\", \"chica en bici acrobática\", 91, 27),\n        _object_event(\"boy-surf\", \"chico surfeando\", 2, 12),\n        _object_event(\"girl-surf\", \"chica surfeando\", 92, 12),\n        _object_event(\"boy-pokeball\", \"chico usando una MO\", 3, 5),\n        _object_event(\"girl-pokeball\", \"chica usando una MO\", 93, 5),\n        _object_event(\"boy-underwater\", \"chico buceando\", 111, 9),\n        _object_event(\"girl-underwater\", \"chica buceando\", 112, 9),\n        _object_event(\"boy-fishing\", \"chico pescando\", 137, 12),\n        _object_event(\"girl-fishing\", \"chica pescando\", 138, 12),\n        _object_event(\"boy-watering\", \"chico regando con la Regadera Wailmer\", 191, 9),\n        _object_event(\"girl-watering\", \"chica regando con la Regadera Wailmer\", 192, 9),\n        _object_event(\"boy-decorating\", \"chico decorando su base secreta\", 193, 1),\n        _object_event(\"girl-decorating\", \"chica decorando su base secreta\", 194, 1),\n    ],\n    # The rival entries (100-109) draw the player's own images. The link entries\n    # (216, 217) draw Brendan's images with May's palette already in retail, so\n    # they are left out.\n    palette_users={\n        PAL_TAG_BRENDAN: [\n            (0, 18),\n            (1, 9),\n            (2, 12),\n            (3, 5),\n            (63, 27),\n            (137, 12),\n            (191, 9),\n            (193, 1),\n        ],\n        PAL_TAG_MAY: [\n            (89, 18),\n            (90, 9),\n            (91, 27),\n            (92, 12),\n            (93, 5),\n            (138, 12),\n            (192, 9),\n            (194, 1),\n        ],\n        PAL_TAG_PLAYER_UNDERWATER: [(111, 9), (112, 9)],\n    },\n    starters=EmeraldStarters(),\n    max_species=386,\n)\n\nGBA_GAMES = [EMERALD]\n\n\ndef open_rom(data: bytes, label: str) -> \"SpriteRom | GbaRom\":\n    \"\"\"Open a DS or GBA ROM, whichever `data` is.\"\"\"\n    if not is_gba_rom(data):\n        return SpriteRom(data, label)\n    game_code = bytes(data[0xAC:0xB0])\n    for game in GBA_GAMES:\n        if game_code[:3] in game.game_codes:\n            return GbaRom(data, label, game)\n    supported = \", \".join(game.name for game in GBA_GAMES)\n    raise RomError(\n        f\"{label} es un juego de GBA con el código {game_code.decode(errors='replace')};\"\n        f\" de GBA por ahora solo se soporta {supported}\"\n    )\n\n\ndef open_rom_file(path: Path) -> \"SpriteRom | GbaRom\":\n    return open_rom(path.read_bytes(), str(path))\n\n\nclass SpriteRom:\n    def __init__(self, data: bytes, label: str):\n        \"\"\"`label` names the ROM in error messages (its path or file name).\"\"\"\n        not_a_rom = RomError(f\"{label} no parece una ROM de Nintendo DS\")\n        try:\n            self.rom = NintendoDSRom(data)\n        except Exception as error:\n            raise not_a_rom from error\n        # ndspy happily parses any bytes; a real ROM has a printable game code.\n        if not (self.rom.idCode.isascii() and self.rom.idCode.isalnum()):\n            raise not_a_rom\n        self.game = _detect_game(label, self.rom.idCode)\n        self._archives: dict[str, NARC] = {}\n        self._changed_archives: set[str] = set()\n        self._overlays: dict[int, Overlay] | None = None\n        self._edited_overlays: dict[int, bytearray] = {}\n\n    @classmethod\n    def from_file(cls, path: Path) -> \"SpriteRom\":\n        return cls(path.read_bytes(), str(path))\n\n    def slot(self, name: str) -> Slot:\n        slot = self.game.slots_by_name.get(name)\n        if slot is None:\n            raise RomError(\n                f\"'{name}' no es un sprite de {self.game.name};\"\n                f\" opciones: {', '.join(self.game.slots_by_name)}\"\n            )\n        return slot\n\n    def read_sheet(self, slot: Slot) -> SpriteSheet:\n        return slot.graphic.read(self.archive)\n\n    def replace_sheet(self, slot: Slot, sheet: SpriteSheet) -> None:\n        slot.graphic.write(self.edit_archive, sheet)\n\n    def archive(self, path: str) -> list[bytes]:\n        \"\"\"The member files of a NARC archive, to read.\"\"\"\n        if path not in self._archives:\n            self._archives[path] = NARC(self.rom.getFileByName(path))\n        return self._archives[path].files\n\n    def edit_archive(self, path: str) -> list[bytes]:\n        \"\"\"The member files of a NARC archive, to change: they are saved by to_bytes.\"\"\"\n        self._changed_archives.add(path)\n        return self.archive(path)\n\n    def overlay(self, number: int) -> bytes:\n        \"\"\"An ARM9 overlay's code, decompressed, to read.\"\"\"\n        if number in self._edited_overlays:\n            return bytes(self._edited_overlays[number])\n        return self._overlay_table()[number].data\n\n    def edit_overlay(self, number: int) -> bytearray:\n        \"\"\"An ARM9 overlay's code, decompressed, to change: it is saved by to_bytes.\"\"\"\n        if number not in self._edited_overlays:\n            self._edited_overlays[number] = bytearray(\n                self._overlay_table()[number].data\n            )\n        return self._edited_overlays[number]\n\n    @property\n    def max_species(self) -> int:\n        return self.game.max_species\n\n    def starters(self) -> list[int] | None:\n        \"\"\"The 3 starters as National Pokédex numbers, or None if the game can't change them.\"\"\"\n        return self.game.starters.read(self) if self.game.starters else None\n\n    def set_starters(self, species: list[int]) -> None:\n        self.game.starters.write(self, species)\n\n    def to_bytes(self) -> bytes:\n        for path in self._changed_archives:\n            self.rom.setFileByName(path, self._archives[path].save())\n        self._save_overlays()\n        return self.rom.save()\n\n    def save(self, path: Path) -> None:\n        path.write_bytes(self.to_bytes())\n\n    def _overlay_table(self) -> dict[int, Overlay]:\n        if self._overlays is None:\n            self._overlays = self.rom.loadArm9Overlays()\n        return self._overlays\n\n    def _save_overlays(self) -> None:\n        compressed_changed = False\n        for number, data in self._edited_overlays.items():\n            overlay = self._overlays[number]\n            overlay.data = bytes(data)\n            if overlay.compressed:\n                # The table stores each compressed overlay's size, so it is rewritten below.\n                self.rom.files[overlay.fileID] = overlay.save(compress=True)\n                compressed_changed = True\n            else:\n                # Uncompressed overlays keep their table entry as shipped.\n                self.rom.files[overlay.fileID] = overlay.data\n        if compressed_changed:\n            self.rom.arm9OverlayTable = saveOverlayTable(self._overlays)\n\n\ndef _detect_game(label: str, game_code: bytes) -> Game:\n    for game in GAMES:\n        if game_code[:3] in game.game_codes:\n            return game\n    supported = \", \".join(game.name for game in GAMES)\n    raise RomError(\n        f\"{label} tiene el código de juego {game_code.decode(errors='replace')};\"\n        f\" solo se soportan {supported}\"\n    )\n", "gba.py": "\"\"\"Pokémon GBA ROMs (for now Emerald): the player's overworld sprites.\n\nA GBA ROM has no file system; its graphics live at fixed addresses that differ\nbetween languages. The tables are found by content instead: the graphics info\nstruct of Brendan's walking sprite, the pointer table that lists it, and the\nobject palette table. Layouts and indexes come from pret/pokeemerald\n(include/global.fieldmap.h, include/constants/event_objects.h,\nsrc/data/object_events/*.h and src/event_object_movement.c).\n\nEvery sprite of a character shares one 16-color palette, so replacing a sheet\nrebuilds that palette from the colors all of the character's sprites use.\n\"\"\"\n\nimport struct\nfrom dataclasses import dataclass\n\nfrom platsprites.sheet import TRANSPARENT_INDEX, PlatspritesError, SpriteSheet\n\nROM_BASE = 0x08000000\nHEADER_GAME_CODE = 0xAC\nHEADER_FIXED_VALUE = 0xB2\nGBA_FIXED_VALUE = 0x96\n\nGRAPHICS_INFO_SIZE = 0x24\nGRAPHICS_INFO_IMAGES = 0x1C\nFRAME_IMAGE_SIZE = 8\nPALETTE_ENTRY_SIZE = 8\nCOLORS = 16\nTILE = 8\nBYTES_PER_TILE = 32\n\nBRENDAN_NORMAL = 0\nMAY_NORMAL = 89\nTAG_NONE = 0xFFFF\nPAL_TAG_BRENDAN = 0x1100\nPAL_TAG_MAY = 0x1110\nPAL_TAG_PLAYER_UNDERWATER = 0x1115\nPAL_TAG_BRIDGE_REFLECTION = 0x1102\n# tileTag, paletteTag, reflectionPaletteTag, size, width, height of Brendan walking.\nBRENDAN_NORMAL_SIGNATURE = struct.pack(\n    \"\u003cHHHHhh\", TAG_NONE, PAL_TAG_BRENDAN, PAL_TAG_BRIDGE_REFLECTION, 0x200, 16, 32\n)\n\n\nclass GbaError(PlatspritesError):\n    pass\n\n\ndef is_gba_rom(data: bytes) -> bool:\n    return (\n        len(data) > HEADER_FIXED_VALUE and data[HEADER_FIXED_VALUE] == GBA_FIXED_VALUE\n    )\n\n\n@dataclass(frozen=True)\nclass ObjectEventSprite:\n    \"\"\"An overworld sprite: `frames` frame images listed by graphics info `gfx`.\"\"\"\n\n    gfx: int\n    frames: int\n\n\n@dataclass(frozen=True)\nclass GbaGame:\n    name: str\n    game_codes: tuple[bytes, ...]\n    slots: list\n    # Every graphics info drawn with each player palette, as (gfx, frames);\n    # changing a palette must keep all of them looking right.\n    palette_users: dict[int, list[tuple[int, int]]]\n    # Reads and writes the 3 starters (and the rival teams that depend on them).\n    starters: object | None = None\n    max_species: int = 0\n\n    @property\n    def slots_by_name(self) -> dict:\n        return {slot.name: slot for slot in self.slots}\n\n\n@dataclass\nclass _Frame:\n    address: int\n    width: int\n    height: int\n\n\nclass GbaRom:\n    def __init__(self, data: bytes, label: str, game: GbaGame):\n        self.data = bytearray(data)\n        self.label = label\n        self.game = game\n        self._graphics_table = self._find_graphics_table()\n        self._palettes = self._find_palettes()\n        self._pending: dict[str, tuple] = {}\n\n    def slot(self, name: str):\n        return find_slot(self.game, name)\n\n    def read_sheet(self, slot) -> SpriteSheet:\n        frames = self._frames(slot.graphic)\n        palette = self._palette(self._palette_tag(slot.graphic.gfx))\n        first = frames[0]\n        return SpriteSheet(\n            name=slot.name,\n            width=first.width,\n            height=first.height,\n            color0_transparent=True,\n            frames=[self._read_frame(frame) for frame in frames],\n            palette=palette,\n        )\n\n    def replace_sheet(self, slot, sheet: SpriteSheet) -> None:\n        \"\"\"Queue `sheet`; sheets sharing a palette are written together by to_bytes.\"\"\"\n        self._pending[slot.name] = (slot, sheet)\n\n    def to_bytes(self) -> bytes:\n        by_palette: dict[int, list] = {}\n        for slot, sheet in self._pending.values():\n            by_palette.setdefault(self._palette_tag(slot.graphic.gfx), []).append(\n                (slot, sheet)\n            )\n        # Check every palette before writing any, so a refused import changes nothing.\n        palettes = {\n            tag: self._merged_palette(tag, edits) for tag, edits in by_palette.items()\n        }\n        for tag, edits in by_palette.items():\n            for slot, sheet in edits:\n                frames = self._frames(slot.graphic)\n                for frame, pixels in zip(frames, sheet.frames):\n                    self._write_frame(\n                        frame, _reindex(pixels, sheet.palette, palettes[tag])\n                    )\n            struct.pack_into(\n                f\"\u003c{COLORS}H\", self.data, self._palettes[tag], *palettes[tag]\n            )\n        self._pending.clear()\n        return bytes(self.data)\n\n    def save(self, path) -> None:\n        path.write_bytes(self.to_bytes())\n\n    @property\n    def max_species(self) -> int:\n        return self.game.max_species\n\n    def starters(self) -> list[int] | None:\n        \"\"\"The 3 starters as National Pokédex numbers, or None if the game can't change them.\"\"\"\n        return self.game.starters.read(self) if self.game.starters else None\n\n    def set_starters(self, species: list[int]) -> None:\n        self.game.starters.write(self, species)\n\n    def _merged_palette(self, tag: int, edits: list) -> list[int]:\n        \"\"\"The palette with the colors every sprite drawn with it needs after the edits.\n\n        Colors still used keep their slot, so untouched sprites stay identical;\n        new colors take slots nobody uses anymore.\n        \"\"\"\n        palette = self._palette(tag)\n        if all(sheet.palette == palette for _, sheet in edits):\n            return palette\n        edited_addresses = {\n            frame.address for slot, _ in edits for frame in self._frames(slot.graphic)\n        }\n        needed = set()\n        for frame in self._palette_frames(tag):\n            if frame.address not in edited_addresses:\n                needed |= {palette[index] for index in self._read_frame(frame) if index}\n        for _, sheet in edits:\n            for pixels in sheet.frames:\n                needed |= {sheet.palette[index] for index in pixels if index}\n\n        kept_slots = {index for index in range(1, COLORS) if palette[index] in needed}\n        kept_colors = {palette[index] for index in kept_slots}\n        new_colors = [color for color in sorted(needed) if color not in kept_colors]\n        free_slots = [index for index in range(1, COLORS) if index not in kept_slots]\n        if len(new_colors) > len(free_slots):\n            untouched = [\n                slot.name\n                for slot in self.game.slots\n                if self._palette_tag(slot.graphic.gfx) == tag\n                and slot.name not in {edited.name for edited, _ in edits}\n            ]\n            raise GbaError(\n                f\"los sprites que comparten paleta con {', '.join(slot.name for slot, _ in edits)}\"\n                f\" usarían {len(needed)} colores y caben {COLORS - 1}. En GBA todos los sprites de\"\n                \" un personaje comparten 15 colores: usa los colores que ya tiene, o cambia también\"\n                f\" {', '.join(untouched)} con la paleta nueva en la misma importación\"\n            )\n        merged = list(palette)\n        for index, color in zip(free_slots, new_colors):\n            merged[index] = color\n        return merged\n\n    def _palette_frames(self, tag: int) -> list[_Frame]:\n        frames = {}\n        for gfx, count in self.game.palette_users[tag]:\n            for frame in self._frames(ObjectEventSprite(gfx, count)):\n                frames[frame.address] = frame\n        return list(frames.values())\n\n    def _frames(self, graphic: ObjectEventSprite) -> list[_Frame]:\n        \"\"\"The distinct frame images, in the order they are stored in the ROM.\"\"\"\n        info = self._graphics_info(graphic.gfx)\n        width, height = struct.unpack_from(\"\u003chh\", self.data, info + 8)\n        images = self._address(\n            struct.unpack_from(\"\u003cI\", self.data, info + GRAPHICS_INFO_IMAGES)[0]\n        )\n        frames = {}\n        for number in range(graphic.frames):\n            pointer, size = struct.unpack_from(\n                \"\u003cIH\", self.data, images + FRAME_IMAGE_SIZE * number\n            )\n            if size != width * height // 2:\n                raise self._not_recognized()\n            address = self._address(pointer)\n            frames[address] = _Frame(address, width, height)\n        return [frames[address] for address in sorted(frames)]\n\n    def _read_frame(self, frame: _Frame) -> bytes:\n        tiles_wide = frame.width // TILE\n        pixels = bytearray(frame.width * frame.height)\n        for tile in range(frame.width * frame.height // (TILE * TILE)):\n            tile_x, tile_y = tile % tiles_wide * TILE, tile // tiles_wide * TILE\n            for y in range(TILE):\n                for x in range(0, TILE, 2):\n                    byte = self.data[\n                        frame.address + tile * BYTES_PER_TILE + y * 4 + x // 2\n                    ]\n                    row = (tile_y + y) * frame.width + tile_x + x\n                    pixels[row] = byte & 0xF\n                    pixels[row + 1] = byte >> 4\n        return bytes(pixels)\n\n    def _write_frame(self, frame: _Frame, pixels: bytes) -> None:\n        tiles_wide = frame.width // TILE\n        for tile in range(frame.width * frame.height // (TILE * TILE)):\n            tile_x, tile_y = tile % tiles_wide * TILE, tile // tiles_wide * TILE\n            for y in range(TILE):\n                for x in range(0, TILE, 2):\n                    row = (tile_y + y) * frame.width + tile_x + x\n                    byte = pixels[row] | pixels[row + 1] \u003c\u003c 4\n                    self.data[\n                        frame.address + tile * BYTES_PER_TILE + y * 4 + x // 2\n                    ] = byte\n\n    def _palette(self, tag: int) -> list[int]:\n        return list(struct.unpack_from(f\"\u003c{COLORS}H\", self.data, self._palettes[tag]))\n\n    def _palette_tag(self, gfx: int) -> int:\n        return struct.unpack_from(\"\u003cH\", self.data, self._graphics_info(gfx) + 2)[0]\n\n    def _graphics_info(self, gfx: int) -> int:\n        return self._address(\n            struct.unpack_from(\"\u003cI\", self.data, self._graphics_table + 4 * gfx)[0]\n        )\n\n    def _find_graphics_table(self) -> int:\n        \"\"\"The pointer table whose first entry is Brendan walking and entry 89 May walking.\"\"\"\n        start = 0\n        while (struct_at := self.data.find(BRENDAN_NORMAL_SIGNATURE, start)) != -1:\n            start = struct_at + 1\n            pointer = struct.pack(\"\u003cI\", ROM_BASE + struct_at)\n            search = 0\n            while (table := self.data.find(pointer, search)) != -1:\n                search = table + 1\n                if table % 4 == 0 and self._looks_like_graphics_table(table):\n                    return table\n        raise self._not_recognized()\n\n    def _looks_like_graphics_table(self, table: int) -> bool:\n        may = struct.unpack_from(\"\u003cI\", self.data, table + 4 * MAY_NORMAL)[0]\n        if not self._is_rom_pointer(may):\n            return False\n        return struct.unpack_from(\"\u003cH\", self.data, may - ROM_BASE + 2)[0] == PAL_TAG_MAY\n\n    def _find_palettes(self) -> dict[int, int]:\n        \"\"\"Address of each player palette, from the object palette table.\n\n        The table is a run of {pointer, tag, padding} entries ending in a null\n        entry; it is the run that holds Brendan's, May's and the underwater tags.\n        \"\"\"\n        entry = struct.pack(\"\u003cHH\", PAL_TAG_BRENDAN, 0)\n        start = 0\n        while (found := self.data.find(entry, start)) != -1:\n            start = found + 1\n            if found % 4 or found \u003c 4:\n                continue\n            palettes = self._palette_run(found - 4)\n            if all(tag in palettes for tag in self.game.palette_users):\n                return {tag: p
