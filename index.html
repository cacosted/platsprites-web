alettes[tag] for tag in self.game.palette_users}\n        raise self._not_recognized()\n\n    def _palette_run(self, entry: int) -> dict[int, int]:\n        while self._is_palette_entry(entry - PALETTE_ENTRY_SIZE):\n            entry -= PALETTE_ENTRY_SIZE\n        palettes = {}\n        while self._is_palette_entry(entry):\n            pointer, tag, _ = struct.unpack_from(\"\u003cIHH\", self.data, entry)\n            palettes.setdefault(tag, pointer - ROM_BASE)\n            entry += PALETTE_ENTRY_SIZE\n        return palettes\n\n    def _is_palette_entry(self, entry: int) -> bool:\n        if entry \u003c 0 or entry + PALETTE_ENTRY_SIZE > len(self.data):\n            return False\n        pointer, tag, padding = struct.unpack_from(\"\u003cIHH\", self.data, entry)\n        return self._is_rom_pointer(pointer) and 0x1100 \u003c= tag \u003c 0x1200 and padding == 0\n\n    def _is_rom_pointer(self, value: int) -> bool:\n        return ROM_BASE \u003c= value \u003c ROM_BASE + len(self.data)\n\n    def _address(self, pointer: int) -> int:\n        if not self._is_rom_pointer(pointer):\n            raise self._not_recognized()\n        return pointer - ROM_BASE\n\n    def _not_recognized(self) -> GbaError:\n        return GbaError(\n            f\"no encontré los sprites del protagonista en {self.label};\"\n            \" la ROM parece modificada (por ejemplo, un ROM hack) de una forma que esta\"\n            \" herramienta no reconoce\"\n        )\n\n\ndef _reindex(pixels: bytes, old_palette: list[int], new_palette: list[int]) -> bytes:\n    \"\"\"Map each pixel to the new palette slot holding its color, preferring its own slot.\"\"\"\n    if old_palette == new_palette:\n        return pixels\n    slot_of = {}\n    for index in range(COLORS - 1, 0, -1):\n        slot_of[new_palette[index]] = index\n    result = bytearray(len(pixels))\n    for position, index in enumerate(pixels):\n        if index == TRANSPARENT_INDEX:\n            continue\n        color = old_palette[index]\n        result[position] = index if new_palette[index] == color else slot_of[color]\n    return bytes(result)\n\n\ndef find_slot(game: GbaGame, name: str):\n    slot = game.slots_by_name.get(name)\n    if slot is None:\n        raise GbaError(\n            f\"'{name}' no es un sprite de {game.name}; opciones: {', '.join(game.slots_by_name)}\"\n        )\n    return slot\n", "sheet.py": "\"\"\"The format-neutral sprite sheet that every graphic is converted to and from.\"\"\"\n\nfrom dataclasses import dataclass\n\nTRANSPARENT_INDEX = 0\n\n\nclass PlatspritesError(Exception):\n    \"\"\"Base for every error shown to the user as a plain message.\"\"\"\n\n\n@dataclass\nclass SpriteSheet:\n    name: str\n    width: int\n    height: int\n    color0_transparent: bool\n    # Palette indices, one byte per pixel and one entry per frame, in animation order.\n    frames: list[bytes]\n    # BGR555 colors.\n    palette: list[int]\n\n\ndef unpack_4bpp(packed: bytes) -> bytes:\n    \"\"\"Each byte holds two pixels, the left one in the low nibble.\"\"\"\n    pixels = bytearray()\n    for byte in packed:\n        pixels += bytes((byte & 0xF, byte >> 4))\n    return bytes(pixels)\n\n\ndef pack_4bpp(pixels: bytes) -> bytes:\n    return bytes(left | (right \u003c\u003c 4) for left, right in zip(pixels[::2], pixels[1::2]))\n", "ds_starters.py": "\"\"\"DS games: the 3 starters and the rival battles that depend on them.\n\nPlatinum locations come from pret/pokeplatinum (src/applications/choose_starter,\nres/field/scripts, res/trainers) and the Universal Pokémon Randomizer ZX;\nBlack/White ones from the Universal Pokémon Randomizer ZX and the retail\nscripts. Both were checked byte by byte against real ROMs.\n\nEvery write is checked first: each value must hold the current starter (or its\nevolution) where expected, so an unknown or already modified ROM is refused\ninstead of being patched in the wrong place.\n\"\"\"\n\nimport struct\nfrom dataclasses import dataclass\n\nfrom platsprites.sheet import PlatspritesError\n\nEVOLUTION_RECORD = 6\nLEVEL_UP_MOVES = 4\n\n\nclass DsStarterError(PlatspritesError):\n    pass\n\n\n@dataclass(frozen=True)\nclass RivalBattle:\n    # The trainer fought for each of the player's starters (index 0, 1, 2).\n    trainers: tuple[int, int, int]\n    slot: int\n    evolutions: int\n    # The rival's starter is the player's + this, wrapping around: 1 for the\n    # main rival (the one strong against yours), 2 for the other friend.\n    starter_offset: int\n\n\n@dataclass(frozen=True)\nclass PartyFormat:\n    \"\"\"Trainer party entries: their size by trainer type, and where moves start.\"\"\"\n\n    sizes: dict[int, int]\n    species_mask: int\n    moves_without_item: int\n    moves_with_item: int\n\n    def moves_at(self, trainer_type: int) -> int | None:\n        if not trainer_type & 1:\n            return None\n        return self.moves_with_item if trainer_type & 2 else self.moves_without_item\n\n\nGEN4_PARTY = PartyFormat({0: 8, 1: 16, 2: 10, 3: 18}, 0x3FF, 6, 8)\nGEN5_PARTY = PartyFormat({0: 8, 1: 16, 2: 10, 3: 18}, 0xFFFF, 8, 10)\n\n\n@dataclass(frozen=True)\nclass GameData:\n    trainer_data: str\n    trainer_parties: str\n    evolutions: str\n    learnsets: str\n    party: PartyFormat\n    learnset_pairs: (\n        bool  # Gen 5 stores (move, level) pairs; Gen 4 packs both in one u16.\n    )\n    rival_battles: list[RivalBattle]\n\n\ndef _rivals(spec: dict) -> list[RivalBattle]:\n    return [\n        RivalBattle(trainers, slot, evolutions, offset)\n        for offset, battles in spec.items()\n        for trainers, slot, evolutions in battles\n    ]\n\n\nclass _StarterEditor:\n    \"\"\"What Platinum and Black/White share: rival parties, evolutions and moves.\"\"\"\n\n    data: GameData\n\n    def read(self, rom) -> list[int]:\n        raise NotImplementedError\n\n    def write(self, rom, species: list[int]) -> None:\n        current = self.read(rom)\n        party_writes = self._rival_party_writes(rom, current, species)\n        self._write_starters(rom, current, species)\n        parties = rom.edit_archive(self.data.trainer_parties)\n        for trainer, offset, member in party_writes:\n            party = bytearray(parties[trainer])\n            party[offset : offset + len(member)] = member\n            parties[trainer] = bytes(party)\n\n    def _write_starters(self, rom, current: list[int], species: list[int]) -> None:\n        raise NotImplementedError\n\n    def _rival_party_writes(\n        self, rom, current: list[int], species: list[int]\n    ) -> list[tuple[int, int, bytes]]:\n        \"\"\"The new bytes for the starter-line member of every rival battle, checked first.\"\"\"\n        data = self.data\n        trainer_data = rom.archive(data.trainer_data)\n        parties = rom.archive(data.trainer_parties)\n        writes = []\n        for battle in data.rival_battles:\n            for choice, trainer in enumerate(battle.trainers):\n                trainer_type = trainer_data[trainer][0] & 3\n                size = data.party.sizes[trainer_type]\n                offset = battle.slot * size\n                member = bytearray(parties[trainer][offset : offset + size])\n                level, now = struct.unpack_from(\"\u003cHH\", member, 2)\n                expected = self._evolve(\n                    rom,\n                    current[(choice + battle.starter_offset) % 3],\n                    battle.evolutions,\n                )\n                if len(member) != size or now & data.party.species_mask != expected:\n                    raise _not_recognized(rom)\n                new = self._evolve(\n                    rom,\n                    species[(choice + battle.starter_offset) % 3],\n                    battle.evolutions,\n                )\n                struct.pack_into(\"\u003cH\", member, 4, new)\n                if data.party.species_mask == 0xFFFF:\n                    struct.pack_into(\"\u003cH\", member, 6, 0)  # form\n                moves_at = data.party.moves_at(trainer_type)\n                if moves_at is not None:\n                    struct.pack_into(\n                        \"\u003c4H\", member, moves_at, *self._moves(rom, new, level)\n                    )\n                writes.append((trainer, offset, bytes(member)))\n        return writes\n\n    def _evolve(self, rom, species: int, times: int) -> int:\n        \"\"\"Follow the first evolution `times` times; a species that doesn't evolve stays.\"\"\"\n        evolutions = rom.archive(self.data.evolutions)\n        for _ in range(times):\n            method, _, target = struct.unpack_from(\"\u003cHHH\", evolutions[species], 0)\n            if not method or not target:\n                break\n            species = target\n        return species\n\n    def _moves(self, rom, species: int, level: int) -> list[int]:\n        \"\"\"The last 4 different moves the species learns by leveling up to `level`.\"\"\"\n        learnset = rom.archive(self.data.learnsets)[species]\n        moves = []\n        if self.data.learnset_pairs:\n            for position in range(0, len(learnset) - 3, 4):\n                move, learned_at = struct.unpack_from(\"\u003cHH\", learnset, position)\n                if move == 0xFFFF or learned_at > level:\n                    break\n                moves.append(move)\n        else:\n            for position in range(0, len(learnset) - 1, 2):\n                value = struct.unpack_from(\"\u003cH\", learnset, position)[0]\n                if value == 0xFFFF or value >> 9 > level:\n                    break\n                moves.append(value & 0x1FF)\n        last = list(dict.fromkeys(reversed(moves)))[:LEVEL_UP_MOVES][::-1]\n        return last + [0] * (LEVEL_UP_MOVES - len(last))\n\n\n# Platinum ---------------------------------------------------------------------\n\nPLATINUM_STARTER_OVERLAY = 78\nPLATINUM_STARTER_TABLE = 0x1BC0\n# The end of GetSelectedSpecies, whose literal pool holds the three species.\nPLATINUM_STARTER_TABLE_PREFIX = bytes.fromhex(\"044808bd044808bd50f61cf8002008bd\")\n# UPR-ZX's patch so the briefcase previews show the chosen species; the\n# original code builds Turtwig, Chimchar and Piplup from immediates.\nBRIEFCASE_PREFIX = bytes.fromhex(\"000222402104120C\")\nBRIEFCASE_INNER = bytes.fromhex(\"0290039002200002\")\nBRIEFCASE_PATCHED = bytes.fromhex(\"2D182868\")\n# Field scripts comparing the player's starter: member -> offsets of the u16\n# value in each CompareVarToValue (11 00 var value). They pick the rival's and\n# the partner's battle, and a few cosmetic branches (masks, dolls, Rowan).\nPLATINUM_SCRIPT_COMPARES = {\n    427: [0x593, 0x5A0],\n    429: [0x124, 0x131],\n    112: [0x087, 0x094],\n    123: [0x523, 0x530, 0x14A, 0x157, 0x164],\n    36: [0x2C3, 0x2D0],\n    186: [0x1DB, 0x1E8],\n    1096: [0x1DC, 0x1E9],\n    236: [0x432, 0x445],\n    201: [0x31A, 0x32D],\n    2: [0xBD8, 0xBEB, 0xC0A, 0xC1D],\n    136: [0x947, 0x95A, 0x979, 0x98C],\n    12: [0x05F, 0x06C, 0x079],\n    142: [0x0C4, 0x0D1, 0x0DE],\n    92: [0x387, 0x394],\n    1064: [0x1F0, 0x1FD, 0x20A],\n}\nPLATINUM_SCRIPTS = \"fielddata/script/scr_seq.narc\"\n\nPLATINUM_DATA = GameData(\n    trainer_data=\"poketool/trainer/trdata.narc\",\n    trainer_parties=\"poketool/trainer/trpoke.narc\",\n    evolutions=\"poketool/personal/evo.narc\",\n    learnsets=\"poketool/personal/wotbl.narc\",\n    party=GEN4_PARTY,\n    learnset_pairs=False,\n    rival_battles=_rivals(\n        {\n            # Barry\n            1: [\n                ((851, 852, 850), 0, 0),  # Route 201\n                ((248, 249, 247), 1, 0),  # Route 203\n                ((471, 472, 470), 3, 1),  # Route 209 gate\n                ((474, 475, 473), 3, 1),  # Pastoria City\n                ((477, 478, 476), 4, 2),  # Canalave City\n                ((619, 620, 607), 5, 2),  # Spear Pillar, as your partner\n                ((480, 481, 479), 5, 2),  # Pokémon League\n                ((924, 925, 923), 5, 2),  # Fight Area, as your partner\n                ((838, 839, 837), 5, 2),  # Survival Area\n                ((872, 873, 871), 5, 2),  # Survival Area, after 20 League wins\n                ((841, 842, 840), 5, 2),  # Survival Area, unused\n            ],\n            # Dawn or Lucas, your partner against Team Galactic\n            2: [\n                ((615, 613, 614), 0, 0),  # Jubilife City, Lucas\n                ((618, 616, 617), 0, 0),  # Jubilife City, Dawn\n                ((621, 622, 623), 2, 1),  # Veilstone City, Lucas\n                ((624, 625, 626), 2, 1),  # Veilstone City, Dawn\n            ],\n        }\n    ),\n)\n\n\nclass PlatinumStarters(_StarterEditor):\n    data = PLATINUM_DATA\n\n    def read(self, rom) -> list[int]:\n        code = rom.overlay(PLATINUM_STARTER_OVERLAY)\n        start = PLATINUM_STARTER_TABLE - len(PLATINUM_STARTER_TABLE_PREFIX)\n        if code[start:PLATINUM_STARTER_TABLE] != PLATINUM_STARTER_TABLE_PREFIX:\n            raise _not_recognized(rom)\n        return list(struct.unpack_from(\"\u003c3I\", code, PLATINUM_STARTER_TABLE))\n\n    def _write_starters(self, rom, current: list[int], species: list[int]) -> None:\n        scripts = rom.archive(PLATINUM_SCRIPTS)\n        script_writes = _compare_writes(\n            rom, scripts, PLATINUM_SCRIPT_COMPARES, current, species\n        )\n        code = rom.edit_overlay(PLATINUM_STARTER_OVERLAY)\n        struct.pack_into(\"\u003c3I\", code, PLATINUM_STARTER_TABLE, *species)\n        _patch_briefcase(rom, code, species)\n        edited = rom.edit_archive(PLATINUM_SCRIPTS)\n        for member, script in script_writes.items():\n            edited[member] = script\n\n\ndef _compare_writes(rom, scripts, compares, current, species) -> dict[int, bytes]:\n    \"\"\"Each CompareVarToValue against a starter, rewritten to the new starter in that slot.\"\"\"\n    writes = {}\n    for member, offsets in compares.items():\n        script = bytearray(scripts[member])\n        for offset in offsets:\n            value = struct.unpack_from(\"\u003cH\", script, offset)[0]\n            if script[offset - 4 : offset - 2] != b\"\\x11\\x00\" or value not in current:\n                raise _not_recognized(rom)\n            struct.pack_into(\"\u003cH\", script, offset, species[current.index(value)])\n        writes[member] = bytes(script)\n    return writes\n\n\ndef _patch_briefcase(rom, code: bytearray, species: list[int]) -> None:\n    \"\"\"Make the briefcase previews show `species` (UPR-ZX's DPPt starter graphics patch).\"\"\"\n    if code.count(BRIEFCASE_PREFIX) != 1:\n        raise _not_recognized(rom)\n    base = code.find(BRIEFCASE_PREFIX) + len(BRIEFCASE_PREFIX)\n    if code[base : base + 4] != BRIEFCASE_PATCHED:\n        if code.count(BRIEFCASE_INNER) != 1:\n            raise _not_recognized(rom)\n        _relocate_briefcase_code(code, base)\n    offset = base + 0x16 + 0xA\n    for index, number in enumerate(species):\n        low, high = _add_immediates(number - 4 * (index + 1))\n        struct.pack_into(\"\u003cH\", code, offset + 4, low)\n        struct.pack_into(\"\u003cH\", code, offset + 8, high)\n        offset += 0xE\n\n\ndef _relocate_briefcase_code(code: bytearray, offset: int) -> None:\n    \"\"\"The one-time part of the patch: free two instructions per slot for the species.\"\"\"\n\n    def read(position: int) -> int:\n        return struct.unpack_from(\"\u003cH\", code, position)[0]\n\n    def write(position: int, value: int) -> None:\n        struct.pack_into(\"\u003cH\", code, position, value)\n\n    write(offset + 0xC, read(offset + 0xA))\n    if offset % 4 == 0:\n        code[offset + 0xC] = (code[offset + 0xC] - 1) & 0xFF\n    write(offset + 0xA, read(offset + 0x8))\n    code[offset + 0xA] = (code[offset + 0xA] - 1) & 0xFF\n    write(offset + 0x8, read(offset + 0x6))\n    write(offset + 0x6, read(offset + 0x4))\n    write(offset + 0x4, read(offset + 0x2))\n    write(offset + 0x2, 0x6828)\n    write(offset, 0x182D)\n    offset += 0x16\n    write(offset, 0x6828)\n    offset += 0xA\n    for index in range(3):\n        code[offset] = 4 * (index + 1)\n        write(offset + 2, read(offset + 4))\n        offset += 0xE\n    code[offset] = 1\n    inner = code.find(BRIEFCASE_INNER) + len(BRIEFCASE_INNER)\n    code[inner + 1] = 0x68\n\n\ndef _add_immediates(difference: int) -> tuple[int, int]:\n    \"\"\"Two Thumb `adds/subs r2, #imm` that add `difference` (|difference| \u003c= 510).\"\"\"\n    low, high = 0x3200, 0x3200\n    if difference \u003c 0:\n        low |= 0x800\n        difference = -difference\n    elif difference > 255:\n        high |= 0xFF\n        difference -= 255\n    return low | (difference & 0xFF), high\n\n\n# Black/White ------------------------------------------------------------------\n\nBW_SCRIPTS = \"a/0/5/7\"\n# Script values holding a starter species, by member: in the player's house\n# (the Pokémon given, its name and Cheren's) and in the Dreamyard. Each holds\n# one of the 3 starters and is rewritten to the new starter in that slot.\nBW_SCRIPT_SPECIES = {\n    782: [\n        0x27F,\n        0x284,\n        0x2AF,\n        0x2B4,\n        0x2CC,\n        0x2D1,\n        0x356,\n        0x338,\n        0x361,\n        0x5F2,\n        0x5D4,\n        0x5FD,\n    ],\n    304: [0xF9, 0x19C, 0x11C, 0x1C4, 0x12C, 0x1D9],\n}\n# The species given for each ball, in the player's house script.\nBW_GIVEN_STARTERS = (782, [0x27F, 0x2AF, 0x2CC])\nBW_STARTER_OVERLAY = 223\nBW_STARTER_TABLE_PREFIX = bytes.fromhex(\"080a0700080000\")\nBW_SELECTION_GRAPHICS = \"a/2/0/5\"\nBW_POKEMON_GRAPHICS = \"a/0/0/4\"\nBW_FILES_PER_POKEMON = 20\nBW_FRONT_SPRITE = 0\nBW_NORMAL_PALETTE = 18\nBW_SELECTION_PALETTE = 0  # + 2 * ball\nBW_SELECTION_IMAGE = 12  # + ball\n\nBLACK_WHITE_DATA = GameData(\n    trainer_data=\"a/0/9/2\",\n    trainer_parties=\"a/0/9/3\",\n    evolutions=\"a/0/1/9\",\n    learnsets=\"a/0/1/8\",\n    party=GEN5_PARTY,\n    learnset_pairs=True,\n    rival_battles=_rivals(\n        {\n            # Cheren\n            1: [\n                ((53, 54, 55), 0, 0),  # Nuvema Town\n                ((287, 288, 289), 0, 0),  # Striaton City\n                ((56, 57, 58), 0, 0),  # Route 3\n                ((403, 404, 405), 3, 1),  # Route 4\n                ((90, 91, 92), 3, 1),  # Route 5\n                ((539, 540, 541), 3, 1),  # Chargestone Cave\n                ((588, 589, 590), 3, 2),  # Route 10\n                ((591, 592, 593), 5, 2),  # Victory Road, after the game\n            ],\n            # Bianca\n            2: [\n                ((59, 60, 61), 0, 0),  # Nuvema Town\n                ((498, 499, 500), 1, 0),  # Route 2\n                ((507, 508, 509), 3, 1),  # Castelia Gate\n                ((491, 492, 493), 3, 1),  # Nacrene City\n                ((494, 495, 496), 3, 2),  # Route 8\n                ((594, 595, 596), 5, 2),  # Juniper's lab, after the game\n            ],\n        }\n    ),\n)\n\n\nclass BlackWhiteStarters(_StarterEditor):\n    data = BLACK_WHITE_DATA\n\n    def read(self, rom) -> list[int]:\n        member, offsets = BW_GIVEN_STARTERS\n        script = rom.archive(BW_SCRIPTS)[member]\n        return [struct.unpack_from(\"\u003cH\", script, offset)[0] for offset in offsets]\n\n    def _write_starters(self, rom, current: list[int], species: list[int]) -> None:\n        scripts = rom.archive(BW_SCRIPTS)\n        script_writes = _value_writes(rom, scripts, BW_SCRIPT_SPECIES, current, species)\n        code = rom.overlay(BW_STARTER_OVERLAY)\n        table = code.find(BW_STARTER_TABLE_PREFIX) + len(BW_STARTER_TABLE_PREFIX)\n        if (\n            code.count(BW_STARTER_TABLE_PREFIX) != 1\n            or list(struct.unpack_from(\"\u003c3H\", code, table)) != current\n        ):\n            raise _not_recognized(rom)\n        graphics = rom.archive(BW_POKEMON_GRAPHICS)\n        selection = []\n        for ball, number in enumerate(species):\n            first = number * BW_FILES_PER_POKEMON\n            selection.append(\n                (BW_SELECTION_PALETTE + 2 * ball, graphics[first + BW_NORMAL_PALETTE])\n            )\n            selection.append(\n                (\n                    BW_SELECTION_IMAGE + ball,\n                    decompress_lz11(graphics[first + BW_FRONT_SPRITE]),\n                )\n            )\n\n        struct.pack_into(\"\u003c3H\", rom.edit_overlay(BW_STARTER_OVERLAY), table, *species)\n        edited = rom.edit_archive(BW_SCRIPTS)\n        for member, script in script_writes.items():\n            edited[member] = script\n        screen = rom.edit_archive(BW_SELECTION_GRAPHICS)\n        for member, data in selection:\n            screen[member] = data\n\n\ndef _value_writes(rom, scripts, places, current, species) -> dict[int, bytes]:\n    writes = {}\n    for member, offsets in places.items():\n        script = bytearray(scripts[member])\n        for offset in offsets:\n            value = struct.unpack_from(\"\u003cH\", script, offset)[0]\n            if value not in current:\n                raise _not_recognized(rom)\n            struct.pack_into(\"\u003cH\", script, offset, species[current.index(value)])\n        writes[member] = bytes(script)\n    return writes\n\n\ndef decompress_lz11(data: bytes) -> bytes:\n    \"\"\"Nintendo's LZ11 compression, used by Gen 5 Pokémon sprites (first byte 0x11).\"\"\"\n    if data[0] != 0x11:\n        return bytes(data)\n    size = int.from_bytes(data[1:4], \"little\")\n    position = 4\n    if size == 0:\n        size = int.from_bytes(data[4:8], \"little\")\n        position = 8\n    out = bytearray()\n    while len(out) \u003c size:\n        flags = data[position]\n        position += 1\n        for bit in range(7, -1, -1):\n            if len(out) >= size:\n                break\n            if not flags & (1 \u003c\u003c bit):\n                out.append(data[position])\n                position += 1\n                continue\n            first = data[position]\n            indicator = first >> 4\n            if indicator == 0:\n                length = (((first & 0xF) \u003c\u003c 4) | (data[position + 1] >> 4)) + 0x11\n                distance = (((data[position + 1] & 0xF) \u003c\u003c 8) | data[position + 2]) + 1\n                position += 3\n            elif indicator == 1:\n                length = (\n                    ((first & 0xF) \u003c\u003c 12)\n                    | (data[position + 1] \u003c\u003c 4)\n                    | (data[position + 2] >> 4)\n                ) + 0x111\n                distance = (((data[position + 2] & 0xF) \u003c\u003c 8) | data[position + 3]) + 1\n                position += 4\n            else:\n                length = indicator + 1\n                distance = (((first & 0xF) \u003c\u003c 8) | data[position + 1]) + 1\n                position += 2\n            for _ in range(length):\n                out.append(out[-distance])\n    return bytes(out[:size])\n\n\ndef _not_recognized(rom) -> DsStarterError:\n    return DsStarterError(\n        \"no encontré los iniciales o los combates del rival donde los esperaba;\"\n        \" la ROM parece modificada o de una versión que esta herramienta no reconoce\"\n    )\n", "nsbtx.py": "\"\"\"Read and rewrite the paletted sprite sheets stored in NSBTX texture files.\n\nField sprites are NSBTX files with one 4bpp texture per animation frame\n(named `\u003cbase>.1`, `\u003cbase>.2`, ...) sharing a single 16-color palette.\nRewriting keeps the original header and dictionaries untouched and only\nrebuilds the texel and palette data, so the game sees the same layout.\n\"\"\"\n\nimport re\nimport struct\nfrom dataclasses import dataclass\n\nfrom platsprites.sheet import PlatspritesError, SpriteSheet, pack_4bpp, unpack_4bpp\n\nTEX0_START = 0x14\nNAME_LENGTH = 16\nTEXTURE_ENTRY_SIZE = 8\nPALETTE_ENTRY_SIZE = 4\nFORMAT_4BPP = 3\nCOLOR0_TRANSPARENT_FLAG = 0x2000\n\n# Offsets inside the TEX0 block header.\nTEX0_SIZE = 0x04\nTEX_DATA_LENGTH = 0x0C\nTEX_DICT_OFFSET = 0x0E\nTEX_DATA_OFFSET = 0x14\nCOMPRESSED_DATA_LENGTH = 0x1C\nCOMPRESSED_DATA_OFFSET = 0x24\nCOMPRESSED_INFO_DATA_OFFSET = 0x28\nPALETTE_DATA_LENGTH = 0x30\nPALETTE_DICT_OFFSET = 0x34\nPALETTE_DATA_OFFSET = 0x38\nBTX0_FILE_SIZE = 0x08\n\n\nclass NsbtxError(PlatspritesError):\n    pass\n\n\n@dataclass\nclass _Texture:\n    name: str\n    entry_offset: int\n    data_offset: int\n    params: int\n\n    @property\n    def width(self) -> int:\n        return 8 \u003c\u003c ((self.params >> 4) & 7)\n\n    @property\n    def height(self) -> int:\n        return 8 \u003c\u003c ((self.params >> 7) & 7)\n\n    @property\n    def format(self) -> int:\n        return (self.params >> 10) & 7\n\n    @property\n    def frame_number(self) -> int:\n        match = re.search(r\"\\.(\\d+)$\", self.name)\n        return int(match.group(1)) if match else 0\n\n\ndef read_sprite_sheet(data: bytes) -> SpriteSheet:\n    tex0 = _tex0_block(data)\n    textures = _read_textures(tex0)\n    first = textures[0]\n    frame_size = first.width * first.height // 2\n    texel_start = _u32(tex0, TEX_DATA_OFFSET)\n    frames = [\n        unpack_4bpp(\n            tex0[texel_start + t.data_offset : texel_start + t.data_offset + frame_size]\n        )\n        for t in sorted(textures, key=lambda t: t.frame_number)\n    ]\n    return SpriteSheet(\n        name=first.name.rsplit(\".\", 1)[0],\n        width=first.width,\n        height=first.height,\n        color0_transparent=bool(first.params & COLOR0_TRANSPARENT_FLAG),\n        frames=frames,\n        palette=_read_palette(tex0),\n    )\n\n\ndef write_sprite_sheet(data: bytes, sheet: SpriteSheet) -> bytes:\n    \"\"\"Return `data` with its frames and palette replaced by the ones in `sheet`.\"\"\"\n    _check_same_shape(read_sprite_sheet(data), sheet)\n\n    tex0 = bytearray(_tex0_block(data))\n    texel_start = _u32(tex0, TEX_DATA_OFFSET)\n    textures = _read_textures(tex0)\n    texels = _pack_frames(tex0, textures, [pack_4bpp(frame) for frame in sheet.frames])\n    palette = struct.pack(f\"\u003c{len(sheet.palette)}H\", *sheet.palette)\n\n    del tex0[texel_start:]\n    tex0 += texels\n    palette_start = len(tex0)\n    tex0 += palette\n\n    struct.pack_into(\"\u003cI\", tex0, TEX0_SIZE, len(tex0))\n    struct.pack_into(\"\u003cH\", tex0, TEX_DATA_LENGTH, len(texels) >> 3)\n    struct.pack_into(\"\u003cI\", tex0, COMPRESSED_DATA_OFFSET, palette_start)\n    struct.pack_into(\"\u003cI\", tex0, COMPRESSED_INFO_DATA_OFFSET, palette_start)\n    struct.pack_into(\"\u003cI\", tex0, PALETTE_DATA_OFFSET, palette_start)\n\n    result = bytearray(data[:TEX0_START]) + tex0\n    struct.pack_into(\"\u003cI\", result, BTX0_FILE_SIZE, len(result))\n    return bytes(result)\n\n\ndef _pack_frames(\n    tex0: bytearray, textures: list[_Texture], frames: list[bytes]\n) -> bytearray:\n    \"\"\"Lay out frame texels in dictionary order, sharing storage the way the original did.\n\n    Platinum and HeartGold store identical frames once while Black/White keep a\n    copy per frame, so frames share storage only if they shared it in the\n    original file and are still identical.\n    \"\"\"\n    frames_by_number = dict(zip(sorted(t.frame_number for t in textures), frames))\n    texels = bytearray()\n    stored: dict[int, list[tuple[bytes, int]]] = {}\n    for texture in textures:\n        frame = frames_by_number[texture.frame_number]\n        group = stored.setdefault(texture.data_offset, [])\n        offset = next((offset for kept, offset in group if kept == frame), None)\n        if offset is None:\n            offset = len(texels)\n            texels += frame\n            group.append((frame, offset))\n        struct.pack_into(\"\u003cH\", tex0, texture.entry_offset, offset >> 3)\n    return texels\n\n\ndef _check_same_shape(current: SpriteSheet, new: SpriteSheet) -> None:\n    if (new.width, new.height) != (current.width, current.height):\n        raise NsbtxError(\n            f\"los frames deben medir {current.width}x{current.height}, no {new.width}x{new.height}\"\n        )\n    if len(new.frames) != len(current.frames):\n        raise NsbtxError(\n            f\"se esperaban {len(current.frames)} frames, llegaron {len(new.frames)}\"\n        )\n    if len(new.palette) != len(current.palette):\n        raise NsbtxError(\n            f\"la paleta debe tener {len(current.palette)} colores, no {len(new.palette)}\"\n        )\n\n\ndef _tex0_block(data: bytes) -> bytes:\n    if data[:4] != b\"BTX0\" or data[TEX0_START : TEX0_START + 4] != b\"TEX0\":\n        raise NsbtxError(\"no es un archivo NSBTX\")\n    return data[TEX0_START:]\n\n\ndef _read_textures(tex0: bytes) -> list[_Texture]:\n    if _u16(tex0, COMPRESSED_DATA_LENGTH):\n        raise NsbtxError(\"texturas comprimidas (formato 5) no soportadas\")\n\n    textures = []\n    for name, entry_offset in _read_dict(\n        tex0, _u16(tex0, TEX_DICT_OFFSET), TEXTURE_ENTRY_SIZE\n    ):\n        data_offset, params = struct.unpack_from(\"\u003cHH\", tex0, entry_offset)\n        textures.append(_Texture(name, entry_offset, data_offset \u003c\u003c 3, params))\n\n    if not textures:\n        raise NsbtxError(\"el NSBTX no tiene texturas\")\n    first = textures[0]\n    for texture in textures:\n        if texture.format != FORMAT_4BPP:\n            raise NsbtxError(f\"la textura {texture.name} no es de 16 colores (4bpp)\")\n        if (texture.width, texture.height) != (first.width, first.height):\n            raise NsbtxError(\"las texturas del NSBTX tienen tamaños distintos\")\n    return textures\n\n\ndef _read_palette(tex0: bytes) -> list[int]:\n    palettes = list(\n        _read_dict(tex0, _u32(tex0, PALETTE_DICT_OFFSET), PALETTE_ENTRY_SIZE)\n    )\n    if len(palettes) != 1:\n        raise NsbtxError(f\"se esperaba 1 paleta, el NSBTX tiene {len(palettes)}\")\n    start = _u32(tex0, PALETTE_DATA_OFFSET)\n    count = (_u16(tex0, PALETTE_DATA_LENGTH) \u003c\u003c 3) // 2\n    return list(struct.unpack_from(f\"\u003c{count}H\", tex0, start))\n\n\ndef _read_dict(tex0: bytes, offset: int, entry_size: int):\n    \"\"\"Yield (name, entry offset) for each item of a NITRO resource dictionary.\"\"\"\n    count = tex0[offset + 1]\n    entry_header = offset + 4 + 8 + 4 * count\n    if _u16(tex0, entry_header) != entry_size:\n        raise NsbtxError(\"diccionario de recursos con formato inesperado\")\n    entries_start = entry_header + 4\n    names_start = entries_start + entry_size * count\n    for i in range(count):\n        raw_name = tex0[\n            names_start + NAME_LENGTH * i : names_start + NAME_LENGTH * (i + 1)\n        ]\n        yield raw_name.rstrip(b\"\\0\").decode(\"ascii\"), entries_start + entry_size * i\n\n\ndef _u16(data: bytes, offset: int) -> int:\n    return struct.unpack_from(\"\u003cH\", data, offset)[0]\n\n\ndef _u32(data: bytes, offset: int) -> int:\n    return struct.unpack_from(\"\u003cI\", data, offset)[0]\n", "gba_starters.py": "\"\"\"Pokémon Emerald: the 3 starters and the rival battles that depend on them.\n\nTables are found by content, like the sprites, because addresses differ between\nlanguages. Layouts and trainer IDs come from pret/pokeemerald\n(src/starter_choose.c, src/data/trainers.h, src/data/trainer_parties.h,\nsrc/data/pokemon/evolution.h, src/pokemon.c, data/maps/*/scripts.inc).\n\"\"\"\n\nimport struct\nfrom dataclasses import dataclass\n\nfrom platsprites.sheet import PlatspritesError\n\nROM_BASE = 0x08000000\n\n# sPokeballCoords and sStarterLabelCoords, which sit right before sStarterMon and\n# stay put when the starters change.\nSTARTER_ANCHOR = bytes.fromhex(\"3C 40 78 58 B4 40 00 09 10 0A 08 04\")\nTRAINER_SIZE = 0x28\nTRAINER_COUNT = 855\nTRAINER_PARTY_FLAGS = 0x00\nTRAINER_PARTY_SIZE = 0x20\nTRAINER_PARTY = 0x24\n# gTrainers[0] is TRAINER_NONE: all zero except the 0xFF ending its empty name.\nEMPTY_TRAINER = bytes(4) + b\"\\xff\" + bytes(TRAINER_SIZE - 5)\nPARTY_MEMBER_SIZE = {0: 8, 1: 16, 2: 8, 3: 16}\nPARTY_MEMBER_SPECIES = 4\n# sSpeciesToNationalPokedexNum starts with 1..251: Kanto and Johto keep their numbers.\nDEX_TABLE_START = struct.pack(\"\u003c251H\", *range(1, 252))\nSPECIES_COUNT = 411\nEVOLUTION_SIZE = 8\nEVOLUTIONS_PER_SPECIES = 5\n# gEvolutionTable: species 0 has no evolutions, Bulbasaur evolves into Ivysaur at 16.\nEVOLUTION_TABLE_START = (\n    bytes(40)\n    + struct.pack(\"\u003c4H\", 4, 16, 2, 0)\n    + bytes(32)\n    + struct.pack(\"\u003c4H\", 4, 32, 3, 0)\n)\nEVOLUTION_LEVEL = 4\n\n\nclass EmeraldStarterError(PlatspritesError):\n    pass\n\n\n@dataclass(frozen=True)\nclass RivalBattle:\n    trainer: int\n    # Which of the player's starters (0, 1, 2) leads to this battle; the rival\n    # gets the next one, evolved `evolutions` times.\n    player_choice: int\n    evolutions: int\n\n\nTREECKO, TORCHIC, MUDKIP = 0, 1, 2\n# Every battle against Brendan or May, by trainer ID; the starter is their last Pokémon.\nRIVAL_BATTLES = [\n    # Route 103\n    RivalBattle(520, MUDKIP, 0),\n    RivalBattle(523, TREECKO, 0),\n    RivalBattle(526, TORCHIC, 0),\n    RivalBattle(529, MUDKIP, 0),\n    RivalBattle(532, TREECKO, 0),\n    RivalBattle(535, TORCHIC, 0),\n    # Rustboro City (or Route 104)\n    RivalBattle(592, TREECKO, 0),\n    RivalBattle(593, MUDKIP, 0),\n    RivalBattle(599, TORCHIC, 0),\n    RivalBattle(600, MUDKIP, 0),\n    RivalBattle(768, TREECKO, 0),\n    RivalBattle(769, TORCHIC, 0),\n    # Route 110\n    RivalBattle(521, MUDKIP, 1),\n    RivalBattle(524, TREECKO, 1),\n    RivalBattle(527, TORCHIC, 1),\n    RivalBattle(530, MUDKIP, 1),\n    RivalBattle(533, TREECKO, 1),\n    RivalBattle(536, TORCHIC, 1),\n    # Route 119\n    RivalBattle(522, MUDKIP, 1),\n    RivalBattle(525, TREECKO, 1),\n    RivalBattle(528, TORCHIC, 1),\n    RivalBattle(531, MUDKIP, 1),\n    RivalBattle(534, TREECKO, 1),\n    RivalBattle(537, TORCHIC, 1),\n    # Lilycove City\n    RivalBattle(661, MUDKIP, 1),\n    RivalBattle(662, TREECKO, 1),\n    RivalBattle(663, TORCHIC, 1),\n    RivalBattle(664, MUDKIP, 1),\n    RivalBattle(665, TREECKO, 1),\n    RivalBattle(666, TORCHIC, 1),\n]\n\n\nclass EmeraldStarters:\n    \"\"\"Reads and writes the starters of a GbaRom; species are National Pokédex numbers.\"\"\"\n\n    def read(self, rom) -> list[int]:\n        tables = _Tables(rom)\n        return [tables.national(species) for species in tables.starters()]\n\n    def write(self, rom, species: list[int]) -> None:\n        tables = _Tables(rom)\n        current = tables.starters()\n        chosen = [tables.internal(number) for number in species]\n        # Check every rival battle before writing anything.\n        writes = []\n        for battle in RIVAL_BATTLES:\n            offset = tables.rival_species_offset(battle.trainer)\n            rival_now = current[(battle.player_choice + 1) % 3]\n            expected = tables.evolve(rival_now, battle.evolutions)\n            if struct.unpack_from(\"\u003cH\", rom.data, offset)[0] != expected:\n                raise tables.not_recognized()\n            rival_new = chosen[(battle.player_choice + 1) % 3]\n            writes.append((offset, tables.evolve(rival_new, battle.evolutions)))\n        struct.pack_into(\"\u003c3H\", rom.data, tables.starter_table, *chosen)\n        for offset, value in writes:\n            struct.pack_into(\"\u003cH\", rom.data, offset, value)\n\n\nclass _Tables:\n    def __init__(self, rom):\n        self.rom = rom\n        self.data = rom.data\n        self.starter_table = self._find_starter_table()\n        self.trainers = self._find_trainers()\n        dex = self._find_unique(DEX_TABLE_START, alignment=2)\n        self.to_national = struct.unpack_from(f\"\u003c{SPECIES_COUNT}H\", self.data, dex)\n        self.to_internal = {\n            national: index + 1\n            for index, national in enumerate(self.to_national)\n            if national \u003c= 386\n        }\n        self.evolutions = self._find_unique(EVOLUTION_TABLE_START, alignment=4)\n\n    def starters(self) -> list[int]:\n        return list(struct.unpack_from(\"\u003c3H\", self.data, self.starter_table))\n\n    def national(self, species: int) -> int:\n        return self.to_national[species - 1]\n\n    def internal(self, national: int) -> int:\n        return self.to_internal[national]\n\n    def evolve(self, species: int, times: int) -> int:\n        \"\"\"Follow the first evolution `times` times; a species that doesn't evolve stays.\"\"\"\n        for _ in range(times):\n            record = self.evolutions + species * EVOLUTIONS_PER_SPECIES * EVOLUTION_SIZE\n            method, _, target = struct.unpack_from(\"\u003cHHH\", self.data, record)\n            if not method:\n                break\n            species = target\n        return species\n\n    def rival_species_offset(self, trainer: int) -> int:\n        entry = self.trainers + trainer * TRAINER_SIZE\n        flags = self.data[entry + TRAINER_PARTY_FLAGS]\n        size = self.data[entry + TRAINER_PARTY_SIZE]\n        party = struct.unpack_from(\"\u003cI\", self.data, entry + TRAINER_PARTY)[0] - ROM_BASE\n        if (\n            flags not in PARTY_MEMBER_SIZE\n            or not 1 \u003c= size \u003c= 6\n            or not 0 \u003c= party \u003c len(self.data)\n        ):\n            raise self.not_recognized()\n        return party + (size - 1) * PARTY_MEMBER_SIZE[flags] + PARTY_MEMBER_SPECIES\n\n    def _find_starter_table(self) -> int:\n        return self._find_unique(STARTER_ANCHOR, alignment=4) + len(STARTER_ANCHOR)\n\n    def _find_trainers(self) -> int:\n        start = 0\n        while (found := self.data.find(EMPTY_TRAINER, start)) != -1:\n            start = found + 1\n            if found % 4 == 0 and all(\n                self._plausible_trainer(found + index * TRAINER_SIZE)\n                for index in range(1, TRAINER_COUNT)\n            ):\n                return found\n        raise self.not_recognized()\n\n    def _plausible_trainer(self, entry: int) -> bool:\n        if entry + TRAINER_SIZE > len(self.data):\n            return False\n        party = struct.unpack_from(\"\u003cI\", self.data, entry + TRAINER_PARTY)[0]\n        return (\n            self.data[entry + TRAINER_PARTY_FLAGS] in PARTY_MEMBER_SIZE\n            and 1 \u003c= self.data[entry + TRAINER_PARTY_SIZE] \u003c= 6\n            and ROM_BASE \u003c= party \u003c ROM_BASE + len(self.data)\n        )\n\n    def _find_unique(self, pattern: bytes, alignment: int) -> int:\n        matches = []\n        start = 0\n        while (found := self.data.find(pattern, start)) != -1:\n            start = found + 1\n            if found % alignment == 0:\n                matches.append(found)\n        if len(matches) != 1:\n            raise self.not_recognized()\n        return matches[0]\n\n    def not_recognized(self) -> EmeraldStarterError:\n        return EmeraldStarterError(\n            f\"no encontré los iniciales o los combates del rival en {self.rom.label};\"\n            \" la ROM parece modificada de una forma que esta herramienta no reconoce\"\n        )\n", "images.py": "\"\"\"Convert sprite sheets to and from PNG files (frames stacked vertically).\"\"\"\n\nfrom PIL import Image\n\nfrom platsprites.sheet import TRANSPARENT_INDEX, PlatspritesError, SpriteSheet\n\nPALETTE_SIZE = 16\nMAX_OPAQUE_COLORS = PALETTE_SIZE - 1\n\n\nclass ImageError(PlatspritesError):\n    pass\n\n\ndef sheet_to_image(sheet: SpriteSheet) -> Image.Image:\n    image = Image.frombytes(\"P\", _sheet_size(sheet), b\"\".join(sheet.frames))\n    image.putpalette(\n        [channel for color in sheet.palette for channel in _bgr555_to_rgb(color)]\n    )\n    if sheet.color0_transparent:\n        image.info[\"transparency\"] = TRANSPARENT_INDEX\n    return image\n\n\ndef image_to_sheet(image: Image.Image, template: SpriteSheet) -> SpriteSheet:\n    \"\"\"Build a sheet shaped like `template` (same frame size and count) from `image`.\"\"\"\n    width, height = _sheet_size(template)\n    if image.size != (width, height):\n        raise ImageError(\n            f\"el PNG mide {image.size[0]}x{image.size[1]} y debe medir {width}x{height}\"\n            f\" ({len(template.frames)} frames de {template.width}x{template.height} uno debajo del otro)\"\n        )\n\n    if _is_ready_indexed(image):\n        indices, palette = _indexed_pixels(image)\n    else:\n        indices, palette = _quantize_exact(image)\n\n    frame_pixels = template.width * template.height\n    frames = [\n        indices[start : start + frame_pixels]\n        for start in range(0, len(indices), frame_pixels)\n    ]\n    return SpriteSheet(\n        name=template.name,\n        width=template.width,\n        height=template.height,\n        color0_transparent=template.color0_transparent,\n        frames=frames,\n        palette=palette,\n    )\n\n\ndef _is_ready_indexed(image: Image.Image) -> bool:\n    \"\"\"An indexed PNG whose pixels already fit a 16-color palette with index 0 as transparency.\"\"\"\n    if image.mode != \"P\":\n        return False\n    transparency = image.info.get(\"transparency\")\n    if transparency is not None and transparency != TRANSPARENT_INDEX:\n        return False\n    return max(image.tobytes()) \u003c PALETTE_SIZE\n\n\ndef _indexed_pixels(image: Image.Image) -> tuple[bytes, list[int]]:\n    rgb = image.getpalette()[: PALETTE_SIZE * 3]\n    rgb += [0] * (PALETTE_SIZE * 3 - len(rgb))\n    palette = [_rgb_to_bgr555(*rgb[i : i + 3]) for i in range(0, len(rgb), 3)]\n    return image.tobytes(), palette\n\n\ndef _quantize_exact(image: Image.Image) -> tuple[bytes, list[int]]:\n    \"\"\"Map a true-color image onto 15 colors plus transparency, failing if it needs more.\"\"\"\n    color_indices: dict[int, int] = {}\n    indices = bytearray()\n    for red, green, blue, alpha in image.convert(\"RGBA\").get_flattened_data():\n        if alpha \u003c 128:\n            indices.append(TRANSPARENT_INDEX)\n            continue\n        color = _rgb_to_bgr555(red, green, blue)\n        if color not in color_indices:\n            if len(color_indices) == MAX_OPAQUE_COLORS:\n                raise ImageError(\n                    f\"el PNG usa más de {MAX_OPAQUE_COLORS} colores (más el transparente);\"\n                    \" redúcelos en tu editor de imágenes\"\n                )\n            color_indices[color] = len(color_indices) + 1\n        indices.append(color_indices[color])\n\n    palette = [0] + list(color_indices)\n    palette += [0] * (PALETTE_SIZE - len(palette))\n    return bytes(indices), palette\n\n\ndef _sheet_size(sheet: SpriteSheet) -> tuple[int, int]:\n    return sheet.width, sheet.height * len(sheet.frames)\n\n\ndef _bgr555_to_rgb(color: int) -> tuple[int, int, int]:\n    return tuple(_expand_5bit((color >> shift) & 0x1F) for shift in (0, 5, 10))\n\n\ndef _rgb_to_bgr555(red: int, green: int, blue: int) -> int:\n    return (red >> 3) | ((green >> 3) \u003c\u003c 5) | ((blue >> 3) \u003c\u003c 10)\n\n\ndef _expand_5bit(value: int) -> int:\n    return (value \u003c\u003c 3) | (value >> 2)\n", "workspace.py": "\"\"\"The sprite editing session behind both GUIs, and the small API they speak.\n\n`respond` runs one API request; the local server (`gui.py`) feeds it HTTP\nrequests and the standalone web page feeds it calls from JavaScript.\n\"\"\"\n\nimport base64\nimport io\nimport json\nfrom http import HTTPStatus\nfrom urllib.parse import parse_qs, urlparse\n\nfrom PIL import Image\n\nfrom platsprites.games import CATEGORIES, RomError, Slot, SpriteRom, open_rom\nfrom platsprites.images import ImageError, image_to_sheet, sheet_to_image\nfrom platsprites.sheet import PlatspritesError, SpriteSheet\nfrom platsprites.species import species_name\nfrom platsprites.starters import validate_starters\n\n\nclass Workspace:\n    \"\"\"The ROM being edited, the sprites swapped so far and the chosen starters.\"\"\"\n\n    def __init__(self):\n        self.rom_data: bytes | None = None\n        self.rom: SpriteRom | None = None\n        self.replacements: dict[str, SpriteSheet] = {}\n        self.starters: list[int] | None = None\n\n    def load(self, data: bytes, name: str) -> dict:\n        rom = open_rom(data, name)\n        self.rom_data, self.rom, self.replacements, self.starters = data, rom, {}, None\n        present = {slot.category for slot in rom.game.slots}\n        return {\n            \"game\": rom.game.name,\n            \"categories\": [\n                {\"id\": category, \"name\": name}\n                for category, name in CATEGORIES.items()\n                if category in present\n            ],\n            \"slots\": [self._describe(slot) for slot in rom.game.slots],\n            \"starters\": self._describe_starters(),\n        }\n\n    def choose_starters(self, species: list[int]) -> dict:\n        rom = self._rom()\n        if rom.starters() is None:\n            raise RomError(f\"{rom.game.name} todavía no permite cambiar los iniciales\")\n        chosen = validate_starters(species, rom.max_species)\n        self.starters = None if chosen == rom.starters() else chosen\n        return self._describe_starters()\n\n    def keep_starters(self) -> dict:\n        self.starters = None\n        return self._describe_starters()\n\n    def replace(self, slot_name: str, png: bytes) -> dict:\n        slot = self._rom().slot(slot_name)\n        try:\n            with Image.open(io.BytesIO(png)) as image:\n                sheet = image_to_sheet(image, self._rom().read_sheet(slot))\n        except (OSError, Image.DecompressionBombError) as error:\n            raise ImageError(\"el archivo no es una imagen PNG válida\") from error\n        self.replacements[slot.name] = sheet\n        return self._describe(slot)\n\n    def revert(self, slot_name: str) -> dict:\n        slot = self._rom().slot(slot_name)\n        self.replacements.pop(slot.name, None)\n        return self._describe(slot)\n\n    def build(self) -> bytes:\n        if not self.replacements and self.starters is None:\n            raise RomError(\"todavía no cambiaste ningún sprite ni los iniciales\")\n        rom = open_rom(self.rom_data, \"la ROM\")\n        for slot_name, sheet in self.replacements.items():\n            rom.replace_sheet(rom.slot(slot_name), sheet)\n        if self.starters is not None:\n            rom.set_starters(self.starters)\n        return rom.to_bytes()\n\n    def _rom(self) -> SpriteRom:\n        if self.rom is None:\n            raise RomError(\"primero carga una ROM\")\n        return self.rom\n\n    def _describe_starters(self) -> dict | None:\n        rom = self._rom()\n        try:\n            current = rom.starters()\n        except PlatspritesError as error:\n            # The sprites may still be editable, e.g. in a ROM hack that moved other tables.\n            return {\"error\": str(error)}\n        if current is None:\n            return None\n        return {\n            \"current\": current,\n            \"chosen\": self.starters,\n            \"species\": [\n                [number, species_name(number)]\n                for number in range(1, rom.max_species + 1)\n            ],\n        }\n\n    def _describe(self, slot: Slot) -> dict:\n        original = self._rom().read_sheet(slot)\n        custom = self.replacements.get(slot.name)\n        return {\n            \"name\": slot.name,\n            \"description\": slot.description,\n            \"category\": slot.category,\n            \"frames\": len(original.frames),\n            \"width\": original.width,\n            \"height\": original.height,\n            \"original\": _png_data_url(original),\n            \"custom\": _png_data_url(custom) if custom else None,\n        }\n\n\ndef respond(\n    workspace: Workspace, method: str, url: str, body: bytes\n) -> tuple[int, str, bytes]:\n    \"\"\"Run the API request `method url` and return (status, content type, body).\"\"\"\n    parsed = urlparse(url)\n    route = ROUTES.get((method, parsed.path))\n    if route is None:\n        return _json(HTTPStatus.NOT_FOUND, {\"error\": \"no existe\"})\n    query = {key: values[0] for key, values in parse_qs(parsed.query).items()}\n    try:\n        result = route(workspace, query, body)\n    except PlatspritesError as error:\n        return _json(HTTPStatus.BAD_REQUEST, {\"error\": str(error)})\n    if isinstance(result, bytes):\n        return int(HTTPStatus.OK), \"application/octet-stream\", result\n    return _json(HTTPStatus.OK, result)\n\n\ndef _load_rom(workspace: Workspace, query: dict, body: bytes) -> dict:\n    return workspace.load(body, query.get(\"name\", \"la ROM\"))\n\n\ndef _replace_sprite(workspace: Workspace, query: dict, body: bytes) -> dict:\n    return workspace.replace(query.get(\"slot\", \"\"), body)\n\n\ndef _revert_sprite(workspace: Workspace, query: dict, body: bytes) -> dict:\n    return workspace.revert(query.get(\"slot\", \"\"))\n\n\ndef _build_rom(workspace: Workspace, query: dict, body: bytes) -> bytes:\n    return workspace.build()\n\n\ndef _choose_starters(workspace: Workspace, query: dict, body: bytes) -> dict:\n    try:\n        species = [int(number) for number in json.loads(body)[\"species\"]]\n    except (ValueError, KeyError, TypeError) as error:\n        raise RomError(\"la lista de iniciales no es válida\") from error\n    return workspace.choose_starters(species)\n\n\ndef _keep_starters(workspace: Workspace, query: dict, body: bytes) -> dict:\n    return workspace.keep_starters()\n\n\nROUTES = {\n    (\"POST\", \"/api/rom\"): _load_rom,\n    (\"POST\", \"/api/sprite\"): _replace_sprite,\n    (\"DELETE\", \"/api/sprite\"): _revert_sprite,\n    (\"POST\", \"/api/build\"): _build_rom,\n    (\"POST\", \"/api/starters\"): _choose_starters,\n    (\"DELETE\", \"/api/starters\"): _keep_starters,\n}\n\n\ndef _json(status: HTTPStatus, payload: dict) -> tuple[int, str, bytes]:\n    # A plain int, which Pyodide hands to JavaScript as a number.\n    body = json.dumps(payload, ensure_ascii=False).encode()\n    return int(status), \"application/json; charset=utf-8\", body\n\n\ndef _png_data_url(sheet: SpriteSheet) -> str:\n    buffer = io.BytesIO()\n    sheet_to_image(sheet).save(buffer, format=\"PNG\")\n    return \"data:image/png;base64,\" + base64.b64encode(buffer.getvalue()).decode()\n"};

  for (const [name, source] of Object.entries(sources)) {
    pyodide.FS.writeFile(`${packageDir}/${name}`, source);
  }
  const respond = pyodide.runPython(`
import sys
sys.path.insert(0, "/home/pyodide")
from platsprites.workspace import Workspace, respond
workspace = Workspace()
lambda method, url, body: respond(workspace, method, url, body.to_bytes() if body else b"")
`);

  return async (method, path, body) => {
    // Files, PNGs and JSON text alike.
    const bytes = body ? new Uint8Array(await new Blob([body]).arrayBuffer()) : null;
    const result = respond(method, path, bytes);
    const [status, contentType, payload] = result.toJs();
    result.destroy();
    return new Response(payload, { status, headers: { "Content-Type": contentType } });
  };
})();
</script>
<script>
// Previews fit in this many CSS pixels on their longest side, never above 3x.
const PREVIEW_SIZE = 100;
const MAX_PREVIEW_SCALE = 3;
const FRAME_MS = 160;
const sprites = new Map();
let romName = "";
let starters = null;
let speciesNames = new Map();
let frame = 0;

// The standalone web page sets window.platspritesInBrowser: a promise of a function
// that answers API requests with Python running inside this tab instead of a server.
async function api(method, path, body) {
  const response = window.platspritesInBrowser
    ? await (await window.platspritesInBrowser)(method, path, body)
    : await fetchFromServer(method, path, body);
  if (!response.ok) {
    const { error } = await response.json();
    throw new Error(error);
  }
  return response;
}

async function fetchFromServer(method, path, body) {
  try {
    return await fetch(path, { method, body, headers: { "X-Platsprites": "1" } });
  } catch {
    throw new Error(
      "No hay conexión con platsprites. Revisa que siga abierta la terminal donde corriste " +
      "«platsprites gui»; si la cerraste, vuelve a correrlo y usa la pestaña nueva que se abre.",
    );
  }
}

function setStatus(element, message, kind = "") {
  element.textContent = message;
  element.className = `status ${kind}`;
}

function loadImage(url) {
  const image = new Image();
  image.src = url;
  return image;
}

async function loadRom(file) {
  const loaderStatus = document.querySelector("#loader-status");
  setStatus(loaderStatus, "");
  setLoaderBusy(`Leyendo ${file.name}…`, "Esto toma unos segundos.");
  try {
    const response = await api("POST", `/api/rom?name=${encodeURIComponent(file.name)}`, file);
    showEditor(file.name, await response.json());
  } catch (error) {
    setStatus(loaderStatus, error.message, "error");
  }
  setLoaderBusy(null);
}

function setLoaderBusy(title, detail = "") {
  const loader = document.querySelector("#loader");
  loader.classList.toggle("busy", Boolean(title));
  loader.querySelector(".loading-title").textContent = title ?? "";
  loader.querySelector(".loading-detail").textContent = detail;
}

function showEditor(name, rom) {
  romName = name;
  sprites.clear();
  document.querySelector("#game-name").textContent = rom.game;
  document.querySelector("#rom-name").textContent = name;
  document.querySelector("#categories").replaceChildren(
    ...rom.categories.map((category) => createCategory(category, rom.slots)),
  );
  createFilters(rom.categories);
  showStarters(rom.starters);
  document.querySelector("#loader").hidden = true;
  document.querySelector("#editor").hidden = false;
  setStatus(document.querySelector("#status"), "Descarga un PNG, edítalo y súbelo al mismo sprite.");
  updateBuildButton();
}

function createCategory(category, slots) {
  const section = document.createElement("section");
  section.className = "category";
  section.dataset.category = category.id;
  const cards = slots.filter((slot) => slot.category === category.id).map(createCard);
  const heading = document.createElement("h2");
  heading.append(category.name, " ");
  const count = document.createElement("span");
  count.textContent = `(${cards.length})`;
  heading.append(count);
  const grid = document.createElement("div");
  grid.className = "grid";
  grid.append(...cards);
  section.append(heading, grid);
  return section;
}

function createFilters(categories) {
  const filters = document.querySelector("#filters");
  const options = [{ id: "", name: "Todas" }, ...categories];
  filters.replaceChildren(...options.map((category) => {
    const button = document.createElement("button");
    button.type = "button";
    button.dataset.filter = category.id;
    button.textContent = category.name;
    button.addEventListener("click", () => applyFilter(category.id));
    return button;
  }));
  applyFilter("");
}

function createCard(slot) {
  const card = document.querySelector("#card-template").content.firstElementChild.cloneNode(true);
  card.dataset.slot = slot.name;
  card.querySelector("h3").textContent = slot.description;
  card.querySelector("code").textContent = slot.name;
  const frames = slot.frames === 1 ? "1 frame" : `${slot.frames} frames`;
  card.querySelector(".meta").textContent =
    `${frames} · PNG de ${slot.width}×${slot.height * slot.frames}`;
  const download = card.querySelector(".download");
  download.href = slot.original;
  download.download = `${slot.name}.png`;

  card.querySelector("input").addEventListener("change", (event) => {
    if (event.target.files[0]) uploadSprite(slot.name, event.target.files[0]);
    event.target.value = "";
  });
  card.querySelector(".revert").addEventListener("click", () => revertSprite(slot.name));
  acceptDrops(card, (file) => uploadSprite(slot.name, file));

  const scale = Math.min(MAX_PREVIEW_SCALE, PREVIEW_SIZE / Math.max(slot.width, slot.height));
  for (const preview of card.querySelectorAll("canvas, .empty")) {
    preview.style.width = `${Math.round(slot.width * scale)}px`;
    preview.style.height = `${Math.round(slot.height * scale)}px`;
  }
  for (const canvas of card.querySelectorAll("canvas")) {
    canvas.width = slot.width;
    canvas.height = slot.height;
  }
  sprites.set(slot.name, { card, slot, original: loadImage(slot.original), custom: null });
  renderSlot(slot);
  return card;
}

function renderSlot(slot) {
  const sprite = sprites.get(slot.name);
  sprite.slot = slot;
  sprite.custom = slot.custom ? loadImage(slot.custom) : null;
  const { card } = sprite;
  card.classList.toggle("changed", Boolean(slot.custom));
  card.querySelector("canvas.custom").hidden = !slot.custom;
  card.querySelector(".empty").hidden = Boolean(slot.custom);
  card.querySelector(".revert").hidden = !slot.custom;
  showCardError(card, "");
}

function showCardError(card, message) {
  const error = card.querySelector(".error");
  error.textContent = message;
  error.hidden = !message;
}

async function uploadSprite(slotName, file) {
  const { card } = sprites.get(slotName);
  try {
    const response = await api("POST", `/api/sprite?slot=${encodeURIComponent(slotName)}`, file);
    renderSlot(await response.json());
    updateBuildButton();
  } catch (error) {
    showCardError(card, error.message);
  }
}

async function revertSprite(slotName) {
  const response = await api("DELETE", `/api/sprite?slot=${encodeURIComponent(slotName)}`);
  renderSlot(await response.json());
  updateBuildButton();
}

function changedCount() {
  const startersChanged = starters?.chosen ? 1 : 0;
  return [...sprites.values()].filter((sprite) => sprite.custom).length + startersChanged;
}

function speciesLabel(number) {
  return `#${number} ${speciesNames.get(number)}`;
}

function showStarters(info) {
  starters = info;
  const panel = document.querySelector("#starters");
  panel.hidden = !info;
  if (!info) return;
  if (info.error) {
    document.querySelector("#starters .starter-inputs").hidden = true;
    showStartersError(`No se pueden cambiar los iniciales: ${info.error}`);
    return;
  }
  document.querySelector("#starters .starter-inputs").hidden = false;
  speciesNames = new Map(info.species);
  document.querySelector("#species-list").replaceChildren(...info.species.map(([number]) => {
    const option = document.createElement("option");
    option.value = speciesLabel(number);
    return option;
  }));
  renderStarters();
}

function renderStarters() {
  const shown = starters.chosen ?? starters.current;
  document.querySelectorAll("#starters input").forEach((input, index) => {
    input.value = speciesLabel(shown[index]);
  });
  document.querySelector("#starters").classList.toggle("changed", Boolean(starters.chosen));
  document.querySelector("#reset-starters").hidden = !starters.chosen;
  showStartersError("");
  updateBuildButton();
}

function showStartersError(message) {
  const error = document.querySelector("#starters .error");
  error.textContent = message;
  error.hidden = !message;
}

function parseSpecies(text) {
  const number = Number(text.trim().match(/^#?(\d+)/)?.[1]);
  if (speciesNames.has(number)) return number;
  const wanted = text.trim().toLowerCase();
  return [...speciesNames].find(([, name]) => name.toLowerCase() === wanted)?.[0];
}

async function chooseStarters() {
  const species = [...document.querySelectorAll("#starters input")].map((input) => parseSpecies(input.value));
  if (species.some((number) => number === undefined)) {
    showStartersError("Escribe un Pokémon de la lista, por número o nombre.");
    return;
  }
  try {
    const response = await api("POST", "/api/starters", JSON.stringify({ species }));
    starters = await response.json();
    renderStarters();
  } catch (error) {
    showStartersError(error.message);
  }
}

async function keepOriginalStarters() {
  const response = await api("DELETE", "/api/starters");
  starters = await response.json();
  renderStarters();
}

function updateBuildButton() {
  const count = changedCount();
  const button = document.querySelector("#build");
  button.disabled = count === 0;
  button.textContent = count ? `Generar ROM (${count})` : "Generar ROM";
}

async function buildRom() {
  const status = document.querySelector("#status");
  const button = document.querySelector("#build");
  button.disabled = true;
  setStatus(status, "Generando la ROM…");
  try {
    const response = await api("POST", "/api/build");
    const extension = romName.match(/\.(nds|gba)$/i)?.[1] ?? "nds";
    const fileName = `${romName.replace(/\.(nds|gba)$/i, "")} (sprites).${extension}`;
    const link = document.createElement("a");
    link.href = URL.createObjectURL(await response.blob());
    link.download = fileName;
    link.click();
    URL.revokeObjectURL(link.href);
    setStatus(status, `Listo: se descargó «${fileName}». Ábrela en melonDS.`, "ok");
  } catch (error) {
    setStatus(status, error.message, "error");
  }
  updateBuildButton();
}

function acceptDrops(element, onFile) {
  element.addEventListener("dragover", (event) => {
    event.preventDefault();
    element.classList.add("over");
  });
  element.addEventListener("dragleave", () => element.classList.remove("over"));
  element.addEventListener("drop", (event) => {
    event.preventDefault();
    element.classList.remove("over");
    const file = event.dataTransfer.files[0];
    if (file) onFile(file);
  });
}

function applyFilter(category) {
  for (const button of document.querySelectorAll("[data-filter]")) {
    button.setAttribute("aria-pressed", String(button.dataset.filter === category));
  }
  for (const section of document.querySelectorAll(".category")) {
    section.hidden = Boolean(category) && section.dataset.category !== category;
  }
  drawVisibleSprites();
}

function drawFrame(canvas, image, slot) {
  if (!image || !image.complete || canvas.hidden) return;
  const context = canvas.getContext("2d");
  context.imageSmoothingEnabled = false;
  context.clearRect(0, 0, canvas.width, canvas.height);
  const index = frame % slot.frames;
  context.drawImage(
    image, 0, index * slot.height, slot.width, slot.height,
    0, 0, slot.width, slot.height,
  );
}

function animate() {
  frame += 1;
  drawVisibleSprites();
}

function drawVisibleSprites() {
  for (const { card, slot, original, custom } of sprites.values()) {
    if (card.closest(".category").hidden) continue;
    drawFrame(card.querySelector("canvas.original"), original, slot);
    drawFrame(card.querySelector("canvas.custom"), custom, slot);
  }
}

document.querySelector("#rom-input").addEventListener("change", (event) => {
  if (event.target.files[0]) loadRom(event.target.files[0]);
  event.target.value = "";
});
acceptDrops(document.querySelector("#loader"), loadRom);
document.querySelector("#build").addEventListener("click", buildRom);
for (const input of document.querySelectorAll("#starters input")) {
  input.addEventListener("change", chooseStarters);
  input.addEventListener("focus", () => input.select());
}
document.querySelector("#reset-starters").addEventListener("click", keepOriginalStarters);
document.querySelector("#change-rom").addEventListener("click", () => {
  document.querySelector("#editor").hidden = true;
  document.querySelector("#loader").hidden = false;
});
// Dropping a file outside a drop zone would otherwise navigate away from the page.
window.addEventListener("dragover", (event) => event.preventDefault());
window.addEventListener("drop", (event) => event.preventDefault());
setInterval(animate, FRAME_MS);

async function waitForPythonInBrowser() {
  setLoaderBusy(
    "Preparando el editor…",
    "La primera vez descarga unos 10 MB; después abre en un momento.",
  );
  try {
    await window.platspritesInBrowser;
  } catch (error) {
    setStatus(
      document.querySelector("#loader-status"),
      `No se pudo preparar el editor: ${error.message}. Revisa tu conexión a internet y recarga la página.`,
      "error",
    );
  }
  setLoaderBusy(null);
}

if (window.platspritesInBrowser) waitForPythonInBrowser();
</script>
</body>
</html>
